<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scholar Outflow Lab · Where home-grown researchers end up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --paper-2:#f4f5f7; --card:#ffffff; --ink:#1b1c20; --ink-soft:#6a6e76;
  --line:#ebecef; --line-2:#dcdee3;
  --stay:#157a72; --dual:#b07414; --ret:#566173; --onward:#bb4d2b;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 8px 24px -16px rgba(20,22,28,.18);
  --r:14px;
  --serif:"Noto Serif","Noto Serif SC",Georgia,"Songti SC","Source Han Serif SC",serif;
  --mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:14.5px;line-height:1.7;overflow-x:clip}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}
.mono{font-family:var(--mono)}
button,select,input{font-family:inherit;cursor:pointer}
a{color:var(--stay)}

.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.tb-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px}
.brand .logo{font-size:20px;font-weight:700}
.brand .logo b{color:var(--onward);font-style:normal}
.brand .sub{font-size:10.5px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase}
.origin-pick{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-soft);margin-right:auto}
.origin-pick select{padding:5px 9px;font-size:13px}
.tabs{display:flex;gap:4px;background:var(--paper-2);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tab{border:none;background:transparent;padding:6px 15px;border-radius:999px;font-weight:600;color:var(--ink-soft);font-size:13px}
.tab.active{background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.lang-btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink-soft);
  border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
.lang-btn:hover{color:var(--ink)}

.wrap{max-width:1180px;margin:0 auto;padding:20px}
.notice{border:1px solid var(--line-2);border-left:3px solid var(--onward);background:var(--paper-2);
  border-radius:10px;padding:11px 15px;font-size:12.8px;color:var(--ink-soft);margin-bottom:18px}
.notice b{color:var(--ink)}

.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:flex;gap:3px;background:var(--paper-2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
select,input[type=search]{border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  padding:7px 11px;border-radius:9px;font-size:13px}
input[type=search]{min-width:190px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.c-card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--card);box-shadow:var(--shadow)}
.c-head{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.c-head h3{font-size:16px}
.c-head .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.bar{display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--paper-2)}
.bar span{display:block}
.bar-k{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
.bar-k b{font-family:var(--mono);color:var(--ink);font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
th:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--paper-2)}
.tier{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid}
.tier.R1{color:#0d5b55;border-color:#9ccec9;background:#e6f3f2}
.tier.R2{color:#7a5310;border-color:#e0c58c;background:#faf1e0}
.tier.R3{color:#4a545f;border-color:#c9cfd6;background:#f0f2f4}
.tier.R4{color:#8c3a20;border-color:#e2b3a2;background:#f9ebe6}
.sbar{position:relative;height:8px;border-radius:5px;background:var(--paper-2);min-width:80px}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--stay)}
.sbar u{position:absolute;top:-2px;bottom:-2px;border-left:1px solid rgba(21,122,114,.45);border-right:1px solid rgba(21,122,114,.45);
  background:rgba(21,122,114,.13);text-decoration:none}
/* 13 origins = 15 columns, ~2× viewport width on small screens. Without a pinned first
   column you lose track of which destination row you're on mid-scroll (measured: the
   first column's left goes from 14px to -371px). Pin it so the row label stays visible. */
#cmp-wrap td:first-child, #cmp-wrap th:first-child{
  position:sticky; left:0; z-index:2; background:var(--paper);
  box-shadow:1px 0 0 var(--line-2);
}
#cmp-wrap tbody tr:hover td:first-child{background:var(--paper-2)}
.cmp-hi{font-family:var(--mono);font-weight:700;color:var(--stay)}
.cmp-n{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.cmp-gap{font-family:var(--mono);font-size:12px}
.kindtag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;
  border:1px solid var(--line-2);color:var(--ink-soft);vertical-align:1px}
.muted{color:var(--ink-soft)}
.small{font-size:12px}
.only-s{display:none}   /* Desktop gets a separate country column; small screens tuck it under the name */

.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .veil{position:absolute;inset:0;background:rgba(20,22,28,.28)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--card);
  border-left:1px solid var(--line-2);overflow:auto;padding:22px}
.drawer h2{font-size:19px;margin-bottom:3px}
.close{position:absolute;right:16px;top:16px;border:1px solid var(--line-2);background:var(--card);
  border-radius:8px;padding:5px 10px;font-size:12px}
.kv{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin:10px 0 18px}
.kv span{white-space:nowrap}
.sec-t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:20px 0 8px}

.ask{border:1px solid var(--line-2);border-radius:var(--r);padding:16px 18px;background:var(--paper-2);margin-bottom:18px}
.ask-row{display:flex;gap:14px;flex-wrap:wrap}
.ask-row label{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-soft);flex:1 1 190px}
.ask-row select{width:100%}
.ask-note{margin:12px 0 0;font-size:12.3px;color:var(--ink-soft)}
.ask-note b{color:var(--ink)}
.m-card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--card);
  box-shadow:var(--shadow);margin-bottom:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.m-rank{font-family:var(--mono);font-size:12px;color:var(--ink-soft);min-width:26px}
.m-main{flex:1 1 220px;min-width:0}
.m-main h3{font-size:15.5px}
.m-num{text-align:right;min-width:96px}
.m-num .big{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--stay)}
.m-num .sub{font-size:11px;color:var(--ink-soft);font-family:var(--mono)}
.warn{border-left:3px solid var(--dual);background:var(--paper-2);border-radius:8px;
  padding:10px 14px;font-size:12.6px;color:var(--ink-soft);margin-bottom:14px}
.doc{max-width:760px}
.doc h3{font-size:15px;margin:22px 0 7px}
.doc p,.doc li{color:#33363d;font-size:13.8px}
.doc code{font-family:var(--mono);font-size:12.5px;background:var(--paper-2);padding:1px 5px;border-radius:5px}
.doc ul{padding-left:20px}
.foot{border-top:1px solid var(--line);margin-top:34px;padding:16px 0;font-size:12px;color:var(--ink-soft)}

@media (max-width:720px){
  .wrap{padding:14px}
  .tb-in{padding:10px 14px;gap:10px}
  .brand .sub{display:none}
  .hide-s{display:none}
  .only-s{display:block}
  table{font-size:12.8px}
  td,th{padding:8px 6px}
  .drawer .panel{padding:18px 16px}
}
@media (prefers-color-scheme:dark){
  :root{--paper:#141519;--paper-2:#1c1e23;--card:#191b1f;--ink:#e9eaec;--ink-soft:#9aa0a8;
        --line:#26282e;--line-2:#343740;--stay:#4bab9f;--dual:#d0a04a;--ret:#8892a0;--onward:#d97a55}
  .doc p,.doc li{color:#c6c9cf}
  .tier.R1{background:#123330;border-color:#1f5b54;color:#7fd0c6}
  .tier.R2{background:#33280f;border-color:#5c4720;color:#dcb46c}
  .tier.R3{background:#22252b;border-color:#3a3f48;color:#a7aeb8}
  .tier.R4{background:#331d15;border-color:#5d3327;color:#e09c80}
}
</style>
</head>
<body>

<div class="topbar"><div class="tb-in">
  <div class="brand"><div class="logo" id="brand-logo">Scholar Outflow <b>Lab</b></div><div class="sub" id="brand-sub">去向实验室</div></div>
  <label class="origin-pick" id="origin-wrap" hidden>
    <span id="origin-lbl">Origin</span><select id="origin-sel"></select>
  </label>
  <div class="tabs">
    <button class="tab active" data-view="match"></button>
    <button class="tab" data-view="country"></button>
    <button class="tab" data-view="inst"></button>
    <button class="tab" data-view="compare"></button>
    <button class="tab" data-view="venue"></button>
    <button class="tab" data-view="doc"></button>
  </div>
  <button class="lang-btn" id="lang-btn" title="切换语言 / switch language"></button>
</div></div>

<div class="wrap">
  <div class="notice" id="notice"></div>

  <div id="loading" class="muted"></div>

  <!-- Path finder -->
  <section id="v-match" hidden>
    <div class="ask">
      <div class="ask-row">
        <label><span id="l-mfield"></span>
          <select id="m-field"></select>
        </label>
        <label><span id="l-mcountry"></span>
          <select id="m-country"></select>
        </label>
        <label><span id="l-mkind"></span>
          <select id="m-kind"></select>
        </label>
        <label><span id="l-mstratum"></span>
          <select id="m-stratum"></select>
        </label>
      </div>
      <p class="ask-note" id="ask-note"></p>
    </div>
    <div id="match-coverage"></div>
    <div id="match-summary"></div>
    <div id="match-list"></div>
  </section>

  <!-- Destinations -->
  <section id="v-country" hidden>
    <div class="ctrl">
      <span class="lbl" id="l-stratum1"></span>
      <div class="seg" id="seg-stratum"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="grid" id="country-grid"></div>
  </section>

  <!-- Institutions -->
  <section id="v-inst" hidden>
    <div class="ctrl">
      <span class="lbl" id="l-stratum2"></span>
      <div class="seg" id="seg-stratum2"></div>
      <select id="f-kind"></select>
      <select id="f-country"></select>
      <select id="f-field"></select>
      <input type="search" id="f-q" />
      <span class="muted small" id="inst-count"></span>
    </div>
    <div id="inst-coverage"></div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th data-sort="rank">#</th>
          <th data-sort="name" id="th-name"></th>
          <th data-sort="country" class="hide-s" id="th-country"></th>
          <th data-sort="stay" class="num" id="th-stay"></th>
          <th class="hide-s" id="th-ci"></th>
          <th data-sort="dual" class="num hide-s" id="th-dual"></th>
          <th data-sort="ret" class="num hide-s" id="th-ret"></th>
          <th data-sort="n" class="num" id="th-n"></th>
        </tr></thead>
        <tbody id="inst-body"></tbody>
      </table>
    </div>
    <p class="muted small" id="inst-empty" hidden style="padding:22px 4px"></p>
  </section>

  <!-- Origin comparison -->
  <section id="v-compare" hidden>
    <div class="ctrl">
      <span class="lbl" id="l-stratum3"></span>
      <div class="seg" id="seg-stratum3"></div>
      <span class="muted small" id="cmp-note"></span>
    </div>
    <div id="cmp-wrap"></div>
  </section>

  <!-- Venues -->
  <section id="v-venue" hidden>
    <div class="ctrl">
      <select id="v-field"></select>
      <select id="v-type"></select>
      <input type="search" id="v-q" />
      <span class="muted small" id="venue-count"></span>
    </div>
    <div id="venue-wrap"></div>
  </section>

  <!-- Methodology -->
  <section id="v-doc" hidden class="doc"></section>

  <div class="foot" id="foot"></div>
</div>

<div class="drawer" id="drawer">
  <div class="veil" data-close></div>
  <div class="panel"><button class="close" data-close id="drawer-close"></button><div id="drawer-body"></div></div>
</div>

<script>
/* ── i18n ─────────────────────────────────────────────────────────────
   Default is English; the toggle persists in localStorage.
   Data files keep their original (Chinese) labels — the pipeline is
   untouched. English labels are derived client-side:
   countries via Intl.DisplayNames from the ISO code that every record
   already carries, fields/caveats/notes via the finite dictionaries
   below (unknown strings fall back to the original text, visibly,
   rather than being hidden). */
const LANG_KEY = 'sol-lang';
let LANG = localStorage.getItem(LANG_KEY) || 'en';

const FIELD_EN = {
  '人文艺术':'Arts & Humanities','免疫微生物':'Immunology & Microbiology','兽医':'Veterinary',
  '农业生物':'Agricultural & Biological Sciences','决策科学':'Decision Sciences','化学':'Chemistry',
  '化工':'Chemical Engineering','医学':'Medicine','卫生职业':'Health Professions','口腔':'Dentistry',
  '商管':'Business & Management','地球科学':'Earth & Planetary Sciences','工程':'Engineering',
  '心理学':'Psychology','护理':'Nursing','数学':'Mathematics','材料':'Materials Science',
  '物理天文':'Physics & Astronomy','环境科学':'Environmental Science',
  '生化遗传':'Biochemistry & Genetics','社会科学':'Social Sciences','神经科学':'Neuroscience',
  '经济金融':'Economics & Finance','能源':'Energy','药学':'Pharmacology & Toxicology','计算机':'Computer Science'
};
// Keyed by a stable prefix of the Chinese sentence emitted by compute.py, so a
// wording tweak upstream degrades to showing the original text instead of lying.
const CAVEAT_EN = [
  ['学术履历代理指标','A proxy built from academic affiliation records — not official visa/immigration statistics, and not immigration or legal advice'],
  ['只覆盖在 OpenAlex','Covers only researchers with authorship records in OpenAlex — not representative of students or skilled migrants overall'],
  ['样本框是「曾在来源国机构署名发表」','The sample frame is people who once published under an origin-country affiliation — those who left before ever publishing at home are simply not in it'],
  ['「留下」= 最后已知署名机构','"Stayed" means the last known affiliation is in that country — it does not mean a work permit or permanent residency'],
  ['「双挂」= 末位同时挂','"Dual" means the final affiliations span both the destination and the origin; very common among Chinese researchers, kept separate so neither side is inflated'],
  ['只统计到达年','Only arrivals early enough to allow a 5-year observation window are counted'],
  ['在目的机构须跨 ≥2 个年份','An affiliation must span ≥2 calendar years to count as "arrived"; 2–3-year stints are mostly visiting scholars — always read with the stay-length strata'],
  ['起步那年就已挂在该国','People already affiliated with the destination in their first year are not counted as movers — otherwise lifelong locals would look like migrants who stayed'],
  ['机构由 OpenAlex 从署名字符串','Institutions are parsed by OpenAlex from affiliation strings; filtered through a ROR + output whitelist, but mismatches remain'],
  ['榜单含高校与研究所','The board includes universities and research institutes (CAS / CNRS / NIH / Academia Sinica etc.). Institute records are noisier — see the whitelist notes in the repo'],
  ['学科取自作者最高频 topic','Field labels come from each author\'s most frequent OpenAlex topic and are coarse — much of computer science lands under "Engineering", so the CS slice under-covers institutions; a classification artifact, not a data gap'],
  ['绝对值会随口径漂移','Absolute values drift with sampling choices — only compare institutions/countries against each other'],
];
const NOTE_EN = [
  ['只收录产出 ≥2000 篇','Only venues with ≥2,000 indexed works are included'],
  ['只收录 h-index ≥5','Only venues with h-index ≥5 — without the floor, uncited trade magazines flood in and dilute every percentile line'],
  ['分级 V1–V4','V1–V4 are within-field h-index percentiles; comparing h-index across fields is meaningless, so there is no site-wide banding'],
  ['OA / DOAJ 标记','OA / DOAJ flags are informational only and say nothing about APC costs'],
];
const ORIGIN_EN = {cn:'Mainland China'};
let dnEN = null; try { dnEN = new Intl.DisplayNames(['en'], {type:'region'}); } catch(e){}

const enCountry = (cc, fallback) => {
  if(ORIGIN_EN[cc]) return ORIGIN_EN[cc];
  try { const n = dnEN && dnEN.of(String(cc).toUpperCase()); if(n && n !== String(cc).toUpperCase()) return n; } catch(e){}
  return fallback;
};
const country = (cc, zhName) => LANG === 'en' ? enCountry(cc, zhName) : zhName;
const field = f => LANG === 'en' ? (FIELD_EN[f] || f) : f;
const caveat = c => LANG === 'en' ? ((CAVEAT_EN.find(([p]) => c.startsWith(p)) || [,c])[1]) : c;
const vnote = n => LANG === 'en' ? ((NOTE_EN.find(([p]) => n.startsWith(p)) || [,n])[1]) : n;
const vtype = t => LANG === 'en' ? ({'期刊':'Journal','会议':'Conference'}[t] || t) : t;

const T = {
en: {
  title:'Scholar Outflow Lab · Where home-grown researchers end up',
  brandLogo:'Scholar Outflow <b>Lab</b>', brandSub:'去向实验室',
  origin:'Origin', langBtn:'中文',
  tabs:{match:'Path Finder',country:'Destinations',inst:'Institutions',compare:'Origin Compare',venue:'Venues',doc:'Methodology'},
  notice:`<b>This is not immigration advice, and not visa statistics.</b>
    The data is a migration proxy built from academic authorship records and covers only people who publish;
    "stayed" means the last known affiliation is in that country, not a work permit or permanent residency.
    Absolute values are sensitive to sampling — <b>only compare institutions, countries and origins against each other</b>.
    Full definitions on the Methodology page.`,
  loading:'Loading data…', loadFail:(m)=>`Failed to load data: ${m} (serve over http locally, e.g. python3 -m http.server)`,
  strata:{short:'2–3 yrs (mostly visiting)',long:'≥4 yrs (default)',long6:'≥6 yrs',all:'Any length'},
  out:{stay:'Stayed',dual:'Dual',ret:'Returned',onward:'Onward'},
  legend:{stay:'Stayed (final affiliation only in destination)',dual:'Dual (both sides)',ret:'Returned (only origin)',onward:'Onward (third country)'},
  stayLen:'Stay length',
  lMField:'My field', lMCountry:'Destination', lMKind:'Institution type', lMStratum:'Planned stay',
  kindOpts:['Universities + institutes','Universities only','Institutes only'],
  mStratumOpts:{long:'4+ years (PhD / long-term role)',long6:'6+ years (putting down roots)',short:'2–3 years (visiting / joint program)',all:'Any length'},
  askNote:`Ranked by the <b>lower bound of the 95% CI on the stay rate</b>, not the raw rate —
    40% of a 25-person sample doesn't hold up, and ranking by the bound lets it sink on its own.
    <b>Sample sizes are printed; read them.</b>`,
  anyDest:'Any destination', anyFieldOverall:'Any field (overall)',
  allCountries:'All countries/regions', allFields:'All fields',
  searchInst:'Search institutions…', searchVenue:'Search venues / publishers…',
  instCount:n=>`${n} institutions`, venueCount:n=>`${n} venues`,
  instEmpty:'No institutions match. Loosen the filters, or try another stay-length stratum.',
  th:{name:'Institution',country:'Country/Region',stay:'Stay rate',ci:'95% CI',dual:'Dual',ret:'Returned',n:'n'},
  smallN:' · small n',
  noCountries:'No destination country has enough sample in this stratum.',
  instituteTag:'Institute',
  vTypeOpts:['Journals + conferences','Journals only','Conferences only'],
  venueTh:{tier:'Tier',name:'Venue',pub:'Publisher',h:'h-index',imp:'2-yr cites/paper',works:'Works',rank:'Rank in field'},
  venueBuilding:`<div class="warn">This page is still being filled in.<br>
    The venue board is regrouped by field and the data source has a daily free-tier quota, so it lands in batches —
    it will appear here as soon as it's complete.<br>
    <span class="small">Method and progress are public in the
    <a href="https://github.com/NickkkLian/Scholar-Outflow-Lab" target="_blank" rel="noopener">GitHub repo</a>.</span></div>`,
  cmpOnlyOne:`<div class="warn">Only one origin country has data — nothing to compare yet.
    More origins are harvested day by day (the data source has a daily free quota); this page appears by itself once they land.</div>`,
  cmpLoading:'Loading per-origin data…',

const t = k => T[LANG][k];

// Deep links: #compare, #inst, … open that view directly (and the tab bar keeps the hash in sync).
const VIEWS = ['match','country','inst','compare','venue','doc'];
const hashView = location.hash.slice(1);
const S = {data:null, venues:null, origin:'cn', originList:null, allData:{},
           view: VIEWS.includes(hashView) ? hashView : 'match', stratum:'long', sortKey:'stay', sortDir:-1,
           fCountry:'', fField:'', fKind:'', q:'',
           mField:'', mCountry:'', mKind:'', mStratum:'long',
           vField:'', vType:'', vQ:''};
const OUT_KEYS = [['stay','var(--stay)'],['dual','var(--dual)'],['ret','var(--ret)'],['onward','var(--onward)']];
const pc = v => v==null ? '—' : (v*100).toFixed(1)+'%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// meta.origin_name arrives in Chinese from the data files; display per language.
const originName = m => country(m.origin, m.origin_name);

function stratumSeg(el, onPick){
  el.innerHTML = ['short','long','long6','all'].map(k =>
    `<button data-k="${k}" class="${k===S.stratum?'on':''}">${t('strata')[k]}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if(!b) return;
    S.stratum = b.dataset.k; render(); onPick && onPick(); };
}

function stackBar(s){
  const parts = OUT_KEYS.map(([k,c]) => s[k] ? `<span style="width:${s[k]*100}%;background:${c}"></span>` : '').join('');
  const keys = OUT_KEYS.map(([k]) => `<span>${t('out')[k]} <b>${pc(s[k])}</b></span>`).join('');
  return `<div class="bar">${parts}</div><div class="bar-k">${keys}</div>`;
}

function renderCountries(){
  const g = document.getElementById('country-grid');
  const rows = S.data.countries
    .map(c => ({c, s:c.strata[S.stratum]}))
    .filter(x => x.s && x.s.n >= 60)
    // Default sort is sample size, not stay rate: small-n countries (n<150) have
    // noisy rates, and letting them top the board treats noise as a conclusion.
    .sort((a,b) => b.s.n - a.s.n);
  g.innerHTML = rows.map(({c,s}) => `
    <div class="c-card">
      <div class="c-head"><h3>${esc(country(c.cc, c.name))}</h3>
        <span class="n">n=${s.n}${s.n < 150 ? t('smallN') : ''}</span></div>
      ${stackBar(s)}
    </div>`).join('') || `<p class="muted">${t('noCountries')}</p>`;
}

function instRows(){
  return S.data.institutions
    .map(it => ({it, s:it.strata[S.stratum]}))
    .filter(({it,s}) => s && s.n >= S.data.meta.min_n_inst
      && (!S.fKind || (it.kind || 'edu') === S.fKind)
      && (!S.fCountry || it.cc === S.fCountry)
      && (!S.fField || ((it.fields||{})[S.stratum]||[]).some(f => f.field === S.fField))
      && (!S.q || it.name.toLowerCase().includes(S.q.toLowerCase())))
    .sort((a,b) => {
      const k = S.sortKey;
      const va = k==='rank'? a.it.rank : k==='name'? a.it.name : k==='country'? country(a.it.cc, a.it.country) : a.s[k];
      const vb = k==='rank'? b.it.rank : k==='name'? b.it.name : k==='country'? country(b.it.cc, b.it.country) : b.s[k];
      if(typeof va === 'string') return S.sortDir * va.localeCompare(vb, LANG==='zh'?'zh':'en');
      return S.sortDir * (((va??-1)) - ((vb??-1)));
    });
}

// When few institutions qualify, say why — otherwise it reads as a broken site.
// Measured: qualifying-institution counts track mover counts almost exactly —
// Indonesia 3.9% movers → 7 institutions, China 13.1% → 175.
function coverageNote(){
  const m = S.data && S.data.meta;
  if(!m) return '';
  const n = (S.data.institutions || []).length;
  if(n >= 40) return '';
  const rate = m.mover_rate != null ? pc(m.mover_rate) : '—';
  const md = Object.assign({}, m, {origin_name_disp: originName(m)});
  return `<div class="warn">${t('covNote')(md, n, rate)}</div>`;
}

function renderInsts(){
  const rows = instRows();
  document.getElementById('inst-count').textContent = t('instCount')(rows.length);
  const holder = document.getElementById('inst-coverage');
  if(holder) holder.innerHTML = coverageNote();
  document.getElementById('inst-empty').hidden = rows.length > 0;
  document.getElementById('inst-body').innerHTML = rows.map(({it,s}) => {
    const ci = s.stay_ci || [0,0];
    return `<tr data-id="${it.id}">
      <td><span class="tier ${it.tier}">${it.tier}</span></td>
      <td>${esc(it.name)}${it.kind === 'inst' ? ` <span class="kindtag">${t('instituteTag')}</span>` : ''}
        <div class="muted small only-s">${esc(country(it.cc, it.country))}</div></td>
      <td class="hide-s">${esc(country(it.cc, it.country))}</td>
      <td class="num mono"><b>${pc(s.stay)}</b></td>
      <td class="hide-s"><div class="sbar"><i style="width:${(s.stay||0)*100}%"></i>
        <u style="left:${ci[0]*100}%;width:${Math.max((ci[1]-ci[0])*100,1)}%"></u></div></td>
      <td class="num mono hide-s">${pc(s.dual)}</td>
      <td class="num mono hide-s">${pc(s.ret)}</td>
      <td class="num mono">${s.n}</td>
    </tr>`;
  }).join('');
}

function openInst(id){
  const it = S.data.institutions.find(x => x.id === id);
  if(!it) return;
  const strataRows = ['short','long','long6','all'].map(k => {
    const s = it.strata[k];
    if(!s || !s.n) return '';
    return `<div style="margin:12px 0">
      <div class="c-head"><span class="small"><b>${t('strata')[k]}</b></span><span class="n">n=${s.n}</span></div>
      ${stackBar(s)}</div>`;
  }).join('');
  const fl = (it.fields || {})[S.stratum] || [];
  const fieldRows = fl.length ? `
    <div class="sec-t">${t('secField')(t('strata')[S.stratum])}</div>
    <table><thead><tr><th>${t('fieldTh').field}</th><th class="num">${t('fieldTh').stay}</th><th class="num">${t('fieldTh').ret}</th><th class="num">${t('fieldTh').n}</th></tr></thead>
    <tbody>${fl.map(f => `<tr style="cursor:default"><td>${esc(field(f.field))}</td>
      <td class="num mono">${pc(f.stay)}</td><td class="num mono">${pc(f.ret)}</td>
      <td class="num mono">${f.n}</td></tr>`).join('')}</tbody></table>` : `
    <div class="sec-t">${t('secFieldPlain')}</div>
    <p class="small muted">${t('fieldNoSample')}</p>`;
  document.getElementById('drawer-body').innerHTML = `
    <h2>${esc(it.name)}</h2>
    <div class="kv"><span>${esc(country(it.cc, it.country))}</span><span>·</span>
      <span class="mono">${t('tierRank')(it.tier, it.rank)}</span><span>·</span>
      <span>${it.works.toLocaleString()} ${t('works')}</span></div>
    <div class="sec-t">${t('secStrata')}</div>
    ${strataRows}
    ${fieldRows}
    <div class="sec-t">${t('sources')}</div>
    <p class="small muted">ROR <a href="https://ror.org/${esc(it.ror)}" target="_blank" rel="noopener">${esc(it.ror)}</a>
       · <a href="https://openalex.org/${esc(it.id)}" target="_blank" rel="noopener">OpenAlex ${esc(it.id)}</a></p>`;
  document.getElementById('drawer').classList.add('open');
}

/* ---- Path finder ---- */
function matchRows(){
  const k = S.mStratum, f = S.mField, cc = S.mCountry;
  return S.data.institutions.map(it => {
    const s = it.strata[k];
    if(!s || !s.n) return null;
    if(cc && it.cc !== cc) return null;
    if(S.mKind && (it.kind || 'edu') !== S.mKind) return null;
    if(!f) return {it, s, scoped:false};
    // If a field is chosen, use that field's numbers in the SAME stratum — never
    // fall back to the overall numbers and pretend they're field-scoped.
    const fs = (it.fields[k] || []).find(x => x.field === f);
    return fs ? {it, s:fs, scoped:true} : null;
  }).filter(Boolean)
    .sort((a,b) => (b.s.stay_lb ?? -1) - (a.s.stay_lb ?? -1));
}

function renderMatch(){
  const mc = document.getElementById('match-coverage');
  if(mc) mc.innerHTML = coverageNote();
  const rows = matchRows();
  const sum = document.getElementById('match-summary');
  const list = document.getElementById('match-list');
  const cRec = S.mCountry ? S.data.institutions.find(i => i.cc === S.mCountry) : null;
  const cName = cRec ? country(cRec.cc, cRec.country) : t('anyDest');

  if(!rows.length){
    sum.innerHTML = t('matchNone');
    list.innerHTML = '';
    return;
  }
  const thin = rows.filter(r => r.s.n < 40).length;
  sum.innerHTML = `<div class="warn">${t('matchSummary')(
    S.mField ? field(S.mField) : (LANG==='en'?'All fields':'全学科'),
    cName, t('strata')[S.mStratum], rows.length, thin)}</div>`;

  list.innerHTML = rows.slice(0, 40).map((r, i) => {
    const ci = r.s.stay_ci || [0,0];
    return `<div class="m-card" data-id="${r.it.id}" style="cursor:pointer">
      <span class="m-rank">${i+1}</span>
      <div class="m-main">
        <h3>${esc(r.it.name)}</h3>
        <div class="muted small">${esc(country(r.it.cc, r.it.country))} · Tier ${r.it.tier}${
          r.it.kind === 'inst' ? ` · ${t('instituteTag')}` : ''}${r.scoped ? t('fieldScoped') : ''}</div>
      </div>
      <div style="flex:1 1 150px"><div class="sbar">
        <i style="width:${(r.s.stay||0)*100}%"></i>
        <u style="left:${ci[0]*100}%;width:${Math.max((ci[1]-ci[0])*100,1)}%"></u></div>
        <div class="muted small mono" style="margin-top:4px">95% ${pc(ci[0])}–${pc(ci[1])}</div>
      </div>
      <div class="m-num"><div class="big">${pc(r.s.stay)}</div>
        <div class="sub">${t('stayed')} · n=${r.s.n}</div></div>
    </div>`;
  }).join('');
}

/* ---- Venue board ---- */
function renderVenues(){
  const wrap = document.getElementById('venue-wrap');
  if(!S.venues){
    document.getElementById('venue-count').textContent = '';
    // Visitor-facing copy, not operator notes — no CLI instructions in their face.
    wrap.innerHTML = t('venueBuilding');
    return;
  }
  const rows = S.venues.venues.filter(v =>
    (!S.vField || v.field === S.vField) &&
    (!S.vType || v.type_raw === S.vType) &&
    (!S.vQ || (v.name + ' ' + v.publisher).toLowerCase().includes(S.vQ.toLowerCase()))
  ).slice(0, 300);
  document.getElementById('venue-count').textContent = t('venueCount')(rows.length);
  const th = t('venueTh');
  wrap.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>${th.tier}</th><th>${th.name}</th><th class="hide-s">${th.pub}</th>
      <th class="num">${th.h}</th><th class="num hide-s">${th.imp}</th>
      <th class="num hide-s">${th.works}</th><th class="hide-s">${th.rank}</th></tr></thead>
    <tbody>${rows.map(v => `<tr style="cursor:default">
      <td><span class="tier ${v.tier.replace('V','R')}">${esc(v.tier)}</span></td>
      <td>${esc(v.name)}<div class="muted small only-s">${esc(field(v.field))} · ${esc(vtype(v.type))}</div></td>
      <td class="hide-s muted small">${esc(v.publisher)}</td>
      <td class="num mono"><b>${v.h}</b></td>
      <td class="num mono hide-s">${v.impact}</td>
      <td class="num mono hide-s">${v.works.toLocaleString()}</td>
      <td class="hide-s muted small mono">${v.field_rank}/${v.field_total}</td>
    </tr>`).join('')}</tbody></table></div>
    <p class="muted small" style="margin-top:12px">
      ${S.venues.meta.notes.map(n => esc(vnote(n))).join('　·　')}</p>`;
}

/* ---- Origin comparison: same destination, different starting points ---- */
function renderCompare(){
  const wrap = document.getElementById('cmp-wrap');
  const list = S.originList || [];
  if(list.length < 2){
    wrap.innerHTML = t('cmpOnlyOne');
    return;
  }
  const missing = list.filter(o => !S.allData[o.cc]);
  if(missing.length){
    wrap.innerHTML = `<p class="muted">${t('cmpLoading')}</p>`;
    return;
  }
  const k = S.stratum;
  // Only destinations where ≥2 origins qualify — otherwise the row is mostly blanks.
  const rows = [];
  const ccs = new Set();
  list.forEach(o => (S.allData[o.cc].countries || []).forEach(c => ccs.add(c.cc)));
  ccs.forEach(dc => {
    const cells = list.map(o => {
      const c = (S.allData[o.cc].countries || []).find(x => x.cc === dc);
      const st = c && c.strata[k];
      return (st && st.n >= 60) ? {name: c.name, ...st} : null;
    });
    if(cells.filter(Boolean).length >= 2){
      const vals = cells.filter(Boolean).map(c => c.stay);
      rows.push({dc, name: (cells.find(Boolean) || {}).name || dc, cells,
                 total: cells.reduce((a,c) => a + (c ? c.n : 0), 0),
                 gap: Math.max(...vals) - Math.min(...vals)});
    }
  });
  rows.sort((a,b) => b.total - a.total);

  document.getElementById('cmp-note').textContent = t('cmpNote')(rows.length, list.length);

  wrap.innerHTML = `<div class="warn">${t('cmpWarn')}</div>
    <div style="overflow-x:auto"><table>

function ensureAllOrigins(){
  const list = S.originList || [];
  const todo = list.filter(o => !S.allData[o.cc]);
  if(!todo.length) return Promise.resolve();
  return Promise.all(todo.map(o =>
    fetch(`data-${o.cc}.json`).then(r => r.ok ? r.json() : null)
      .then(d => { if(d) S.allData[o.cc] = d; }).catch(() => {})
  )).then(() => { if(S.view === 'compare') renderCompare(); });
}

function renderDoc(){
  const m = S.data.meta;
  const on = esc(originName(m));
  if(LANG === 'en'){
    document.getElementById('v-doc').innerHTML = `
    <h3>What this site measures</h3>
    <p>One sentence: <b>where researchers who started their careers in ${on} end up</b> — broken down
       by destination country and destination institution.</p>
    <p>It does <b>not</b> answer "which country is easiest to immigrate to", nor "what are international
       students' odds". The sample is researchers with authorship records in OpenAlex; people who left
       before ever publishing at home are simply not in the frame.</p>

    <h3>How it's computed</h3>
    <ul>
      <li><b>Sample</b> — random sample of OpenAlex authors who ever published under a ${on}
          affiliation with ≥${m.min_works} works: <code>${m.sampled_authors.toLocaleString()}</code> authors.</li>
      <li><b>Home start</b> — earliest career year includes ${on}: <code>${m.home_start_authors.toLocaleString()}</code> authors.</li>
      <li><b>Arrival</b> — a later foreign affiliation spanning ≥2 calendar years (a single year is treated
          as co-authorship, not a move). <code>${m.movers.toLocaleString()}</code> authors (${pc(m.mover_rate)}) qualify.</li>
      <li><b>Observation window</b> — only arrivals in <code>${m.arrival_year_cutoff}</code> or earlier count,
          leaving ${m.followup_years} years of follow-up; otherwise "hasn't left yet" gets misread as "stayed".</li>
      <li><b>Institution whitelist</b> — only institutions with a ROR ID and adequate output
          (${m.whitelist_size.toLocaleString()} total), to filter the phantom affiliations OpenAlex
          parses out of free-text strings.</li>
    </ul>

    <h3>Four mutually exclusive outcomes (sum to 100%)</h3>
    <ul>
      <li><b>Stayed</b> — final known affiliations include the destination, not ${on}</li>
      <li><b>Dual</b> — both sides. Very common among Chinese researchers (foreign post + home
          co-appointment); kept separate so it inflates neither side</li>
      <li><b>Returned</b> — only ${on}</li>
      <li><b>Onward</b> — neither; moved to a third country</li>
    </ul>

    <h3>Why stratify by length of stay</h3>
    <p>The 2–3-year band is dominated by visiting scholars and joint-training students — people who were
       always going home. Pooling them dilutes every institution's stay rate toward the same low number.
       The default stratum is <b>≥4 years</b>, closer to PhD studies and long-term positions. Switch strata
       and watch the numbers separate — that separation is itself the finding.</p>

    <h3>How Tiers are assigned</h3>
    <p>Institutions are ranked by the <b>lower bound of the 95% CI</b> on the default-stratum stay rate,
       then cut into quartiles <code>R1</code>–<code>R4</code>. Two deliberate choices:</p>
    <ul>
      <li><b>Percentiles, not absolute cutoffs</b> — absolute values drift with sampling; relative position
          within the same batch is stable.</li>
      <li><b>The bound, not the raw rate</b> — 40% of 25 people versus 30% of 300: the former's true value
          may be far lower. Ranking by the bound lets small-sample flukes sink on their own, with no extra
          rules needed.</li>
    </ul>
    <p>Dual counts toward neither side of the ranking — its meaning is inherently ambiguous.</p>

    <h3>What cross-origin comparison can and cannot tell you</h3>
    <p>The Origin Compare page puts the same destination's stay rates side by side across origins.
       <b>It is the one genuinely interesting thing this site has to show</b> — the same destination can
       differ three- to five-fold by origin, and the direction is consistent across dozens of shared
       destinations. That is not noise.</p>
    <p>But be precise about what it supports:</p>
    <ul>
      <li><b>Valid</b>: relative levels and direction. Every origin uses the same sampling and computation,
          so "A's stay rate is higher than B's" holds up.</li>
      <li><b>Not valid</b>: absolute values. The <b>sample frames differ</b> — each is "people who once
          published under that country's affiliation", and research scale, motives to leave, and publishing
          habits differ by country. The absolute percentages are not quotable statistics.</li>
      <li>A destination appears only when <b>at least two origins qualify</b> (n ≥ 60 each) — otherwise
          a nearly empty row would look like information while carrying none.</li>
    </ul>

    <h3>How the venue board is ranked</h3>
    <ul>
      <li>Only venues with ≥2,000 indexed works and <b>h-index ≥5</b>. The floor isn't cosmetic —
          without it, uncited trade magazines (tens of thousands of works, h=0) flood in, inflate the
          per-field counts and dilute every percentile line.</li>
      <li><code>V1</code>–<code>V4</code> are <b>within-field</b> h-index percentiles (top 10% / 30% / 60% / rest).
          <b>Comparing h-index across fields is meaningless</b>, so there is no site-wide banding.</li>
      <li>h-index and 2-year mean citedness come from OpenAlex <code>summary_stats</code> —
          <b>not the same measure as the JCR impact factor</b>; don't map one to the other.</li>
      <li>Conference coverage in OpenAlex is far thinner than journals, and some conferences split by year
          (e.g. CVPR appears as "2022 IEEE/CVF Conference on…"). <b>Treat the conference list as rough.</b></li>
    </ul>

    <h3>Known limitations (stated, not hidden)</h3>
    <ul>${m.caveats.map(c => `<li>${esc(caveat(c))}</li>`).join('')}</ul>

    <h3>Data source</h3>
    <p>${esc(m.source)}, CC0 public domain, no API key required. Generated <code>${esc(m.generated_at)}</code>.</p>`;
    return;
  }
  document.getElementById('v-doc').innerHTML = `
    <h3>这个站在量什么</h3>
    <p>一句话：<b>在${on}起步的科研人员，出去之后最后落在哪儿</b>——按目的国和目的高校分别统计。</p>
    <p>它<b>不</b>回答「哪个国家好移民」，也不回答「留学生的移民成功率」。它的样本是
       OpenAlex 里有署名记录的科研人群，本科就出国、在国内没发过论文的那一批人根本不在样本里。</p>

    <h3>怎么算的</h3>
    <ul>
      <li><b>样本</b>：OpenAlex 中曾在${on}机构署名、且发表 ≥${m.min_works} 篇的学者随机抽样，
          共 <code>${m.sampled_authors.toLocaleString()}</code> 人。</li>
      <li><b>本土起步</b>：履历最早年份所在国包含${on} → <code>${m.home_start_authors.toLocaleString()}</code> 人。</li>
      <li><b>一次到达</b>：起步之后在某境外机构挂名跨 ≥2 个年份（只挂 1 年视为合作署名，不计）。
          其中 <code>${m.movers.toLocaleString()}</code> 人（${pc(m.mover_rate)}）有过这样的经历。</li>
      <li><b>观察期</b>：只统计到达年 ≤ <code>${m.arrival_year_cutoff}</code> 的人，留足 ${m.followup_years} 年，
          否则「还没来得及走」会被误算成留下。</li>
      <li><b>机构白名单</b>：只认有 ROR 编号、且产出量达标的高校（共 ${m.whitelist_size.toLocaleString()} 所），
          用来滤掉 OpenAlex 从署名字符串里解析出来的幽灵机构。</li>
    </ul>

    <h3>终局四分类（互斥，合计 100%）</h3>
    <ul>
      <li><b>留下</b> — 最后已知任职国含目的国、不含${on}</li>
      <li><b>双挂</b> — 两边都含。中国学者里非常常见（境外教职 + 国内兼聘/合作），单列出来，
          免得把它算进任何一边虚增数字</li>
      <li><b>回流</b> — 只含${on}</li>
      <li><b>转道</b> — 两个都不含，去了第三国</li>
    </ul>

    <h3>为什么一定要按停留时长分层</h3>
    <p>2–3 年那一档以访问学者、联合培养为主——他们本来就是要回国的，混在一起会把所有学校的留下率
       稀释成一样低。默认口径是 <b>≥4 年</b>，更接近读博/长期职位。切换分层，数字会明显分开，这本身就是结论。</p>

    <h3>Tier 怎么定的</h3>
    <p>按默认分层留下率的 <b>95% 置信下界</b>排序，四分位切 <code>R1</code>–<code>R4</code>。两个刻意的选择：</p>
    <ul>
      <li><b>用分位不用绝对线</b>——绝对值会随抽样口径漂移，而「同一批里的相对位置」是稳的。</li>
      <li><b>用下界不用原始比率</b>——25 人样本里的 40% 和 300 人样本里的 30%，前者的真实值可能低得多。
          按下界排，小样本的侥幸高分自己会掉下去，不需要额外加规则去压。</li>
    </ul>
    <p>双挂不计入排序——它的含义本身就是暧昧的。</p>

    <h3>跨来源怎么比才算数</h3>
    <p>「来源对比」页把同一个目的国、不同起点的留下率并排放。<b>这是本站唯一真正有意思的地方</b>——
       同一个目的国，起点不同，留下率能差三到五倍，而且这个方向在几十个共有目的国上是一致的，
       不是噪音。</p>
    <p>但要看清它能比什么、不能比什么：</p>
    <ul>
      <li><b>能比</b>：相对高低与方向。各来源国用的是同一套抽样与计算口径，所以「A 的留下率高于 B」
          这个判断是站得住的。</li>
      <li><b>不能比</b>：绝对值。各来源国的<b>样本框本身不同</b>——都是「曾在本国机构署名发表」的人，
          而各国的科研体量、出国动机、发表习惯都不一样，绝对百分比不是可以直接引用的统计量。</li>
      <li>目的国要求<b>至少两个来源都达标</b>（各自 n ≥ 60）才出现在对比表里，
          否则一列全是空，看着像有信息其实没有。</li>
    </ul>

    <h3>期刊会议榜怎么排</h3>
    <ul>
      <li>只收录产出 ≥2000 篇、且 <b>h-index ≥5</b> 的期刊与会议。
          h 的下限不是为了好看——不设它会混进大量<b>没有被引记录的行业杂志</b>
          （works 一两万、h=0），把学科条目数撑大、分位线整个稀释。</li>
      <li><code>V1</code>–<code>V4</code> 是<b>学科内</b>按 h-index 的分位（前 10% / 30% / 60% / 其余）。
          <b>跨学科比 h-index 没有意义</b>，所以不做全站统一分档。</li>
      <li>h-index 与 2 年篇均被引来自 OpenAlex 的 <code>summary_stats</code>，
          <b>与 JCR 影响因子不是同一口径</b>，别拿来对号。</li>
      <li>会议在 OpenAlex 里的收录远少于期刊，且有些会议按年份拆成多条
          （例如 CVPR 会出现「2022 IEEE/CVF Conference on…」）。<b>会议榜只能当粗略参考。</b></li>
    </ul>

    <h3>已知的坑（别装看不见）</h3>
    <ul>${m.caveats.map(c => `<li>${esc(c)}</li>`).join('')}</ul>

    <h3>数据来源</h3>
    <p>${esc(m.source)}，CC0 公共领域授权，免 API key。生成于 <code>${esc(m.generated_at)}</code>。</p>`;
}

function render(){
  ['match','country','inst','compare','venue','doc'].forEach(v =>
    document.getElementById('v-'+v).hidden = (v !== S.view));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.view === S.view));
  if(S.view === 'match') renderMatch();
  if(S.view === 'country') renderCountries();
  if(S.view === 'inst') renderInsts();
  if(S.view === 'compare'){ renderCompare(); ensureAllOrigins(); }
  if(S.view === 'venue') renderVenues();
  if(S.view === 'doc') renderDoc();
}

function allFields(){
  const set = new Set();
  S.data.institutions.forEach(i =>
    Object.values(i.fields || {}).forEach(list => list.forEach(f => set.add(f.field))));
  return [...set].sort((a,b) => field(a).localeCompare(field(b), LANG==='zh'?'zh':'en'));
}

function initFilters(){
  const ccs = [...new Map(S.data.institutions.map(i => [i.cc, i.country])).entries()]
    .map(([cc, zh]) => [cc, country(cc, zh)])
    .sort((a,b) => a[1].localeCompare(b[1], LANG==='zh'?'zh':'en'));
  const ccOpts = ccs.map(([cc,n]) => `<option value="${cc}">${esc(n)}</option>`).join('');
  const fields = allFields();
  const fOpts = fields.map(f => `<option value="${esc(f)}">${esc(field(f))}</option>`).join('');

  document.getElementById('f-country').innerHTML = `<option value="">${t('allCountries')}</option>` + ccOpts;
  document.getElementById('f-field').innerHTML = `<option value="">${t('allFields')}</option>` + fOpts;
  document.getElementById('m-country').innerHTML = `<option value="">${t('anyDest')}</option>` + ccOpts;
  document.getElementById('m-field').innerHTML = `<option value="">${t('anyFieldOverall')}</option>` + fOpts;
  // Restore current picks after a language switch rebuilds the option lists.
  document.getElementById('f-country').value = S.fCountry;
  document.getElementById('f-field').value = S.fField;
  document.getElementById('m-country').value = S.mCountry;
  document.getElementById('m-field').value = S.mField;
}

function refreshOriginSel(){
  const list = S.originList || [];
  if(list.length <= 1) return;
  const sel = document.getElementById('origin-sel');
  const val = sel.value || S.origin;
  sel.innerHTML = list.map(o =>
    `<option value="${esc(o.cc)}">${esc(t('originOpt')(country(o.cc, o.name), o.institutions))}</option>`).join('');
  sel.value = list.some(o => o.cc === val) ? val : list[0].cc;
}

    document.getElementById('v-field').innerHTML =
      `<option value="">${t('allFields')}</option>` +

function loadOrigin(cc){
  const ld = document.getElementById('loading');
  ld.hidden = false; delete ld.dataset.err;
  ld.textContent = t('loading');
  return fetch(`data-${cc}.json`).then(r => {
    if(!r.ok) throw new Error(`data-${cc}.json ${r.status}`);
    return r.json();
  }).then(d => {
    S.data = d;
    S.origin = cc;
    S.allData[cc] = d;
    d.meta.origin_name_disp = originName(d.meta);
    // Filters picked for the previous origin may not exist in the new data;
    // reset them so the page doesn't go silently blank.
    S.fCountry = S.fField = S.fKind = S.q = S.mField = S.mCountry = S.mKind = '';
    ['f-kind','m-kind'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
    ld.hidden = true;
    stratumSeg(document.getElementById('seg-stratum'));
    stratumSeg(document.getElementById('seg-stratum2'));
    stratumSeg(document.getElementById('seg-stratum3'));
    initFilters();
    document.getElementById('f-q').value = '';
    document.getElementById('foot').innerHTML = t('foot')(d);
    render();
  }).catch(e => {
    ld.hidden = false; ld.dataset.err = '1';
    ld.textContent = t('loadFail')(e.message);
  });
}

// Origin list: the switcher only shows with more than one origin.
fetch('origins.json').then(r => r.ok ? r.json() : null).then(m => {
  const list = (m && m.origins) || [];
  S.originList = list;
  if(list.length > 1){
    const sel = document.getElementById('origin-sel');
    refreshOriginSel();
    sel.value = list.some(o => o.cc === S.origin) ? S.origin : list[0].cc;
    document.getElementById('origin-wrap').hidden = false;
    sel.onchange = e => loadOrigin(e.target.value);
    return loadOrigin(sel.value);
  }
  return loadOrigin(list[0] ? list[0].cc : 'cn');
}).catch(() => loadOrigin('cn'));

};
document.getElementById('drawer').onclick = e => {
  if(e.target.dataset.close !== undefined) document.getElementById('drawer').classList.remove('open');
};
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') document.getElementById('drawer').classList.remove('open');
});
</script>
</body>
