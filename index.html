<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>/* appearance boot — runs before any stylesheet so the stored palette and light/dark apply on the first paint */(function(){try{var d=document.documentElement,L=window.localStorage,t=L.getItem('nl-theme'),s=L.getItem('nl-scheme');if(s===null){var o=L.getItem('theme')||L.getItem('qm-theme');if(o==='dark'||o==='light')s=o;}if(t==='paper'||t==='ink')d.setAttribute('data-theme',t);if(s==='dark'||s==='light')d.setAttribute('data-scheme',s);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Where researchers from 13 countries ended up — every rate shown with its sample size. Scholar Outflow Lab: stay rates by destination and institution, stratified by length of stay, from OpenAlex authorship records.">
<meta name="theme-color" content="#faece9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110c" media="(prefers-color-scheme: dark)">
<title>Scholar Outflow Lab · Where home-grown researchers end up</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..600;1,9..144,400&family=Inter:wght@400..600&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="design-tokens.css">
<style>
/* Scholar Outflow Lab — consumes design tokens only (design-tokens.css). */
/* ===== Fallback faces: until the web fonts load (or if they never do), system fonts are scaled to the measured widths so line lengths and column widths do not jump ===== */
@font-face{font-family:"Fraunces Fallback";src:local("Georgia"),local("Times New Roman");size-adjust:93.3%}
@font-face{font-family:"Inter Fallback";src:local("Helvetica Neue"),local("Arial"),local("Segoe UI");size-adjust:106.5%}
@font-face{font-family:"Space Mono Fallback";src:local("Menlo Regular"),local("Menlo-Regular"),local("Consolas"),local("DejaVu Sans Mono");size-adjust:101.7%}
:root{
  /* the four outcomes are categorical marks: the validated categorical palette, never text colours */
  --o-stay:var(--viz-1); --o-dual:var(--viz-2); --o-ret:var(--viz-3); --o-onward:var(--viz-4);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:var(--weight-regular) var(--text-md)/var(--leading-normal) var(--font-sans);overflow-x:clip;-webkit-tap-highlight-color:transparent;font-variant-numeric:lining-nums}
::selection{background:var(--selection-bg)}
:focus-visible{outline:var(--border-focus-width) solid var(--focus);outline-offset:2px;border-radius:var(--radius-xs)}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:var(--display-weight);line-height:var(--leading-tight);text-wrap:balance;letter-spacing:var(--tracking-title);font-variation-settings:"opsz" var(--opsz-title)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums lining-nums}
button,select,input{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-text);text-underline-offset:.18em;text-decoration-thickness:from-font}
[hidden]{display:none!important}
.skip{position:absolute;left:var(--space-2);top:-48px;background:var(--surface);padding:var(--space-2) var(--space-3);border:1px solid var(--border-input);border-radius:var(--radius-sm);z-index:var(--z-toast)}
.skip:focus{top:var(--space-2)}
.skip:focus-visible{outline-color:var(--on-band)}   /* the link shows on top of the dark top bar, so its ring is drawn on the band */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;white-space:nowrap;clip-path:inset(50%)}
.th-sort{all:unset;cursor:pointer}
.th-sort:focus-visible,tr[data-id]:focus-visible,.m-card[data-id]:focus-visible{outline:var(--border-focus-width) solid var(--focus);outline-offset:2px}

/* ===== topbar ===== */
.topbar{position:sticky;top:0;z-index:var(--z-sticky);background:var(--band);border-bottom:1px solid var(--band-line);color:var(--on-band)}
.tb-in{max-width:var(--content-max);margin:0 auto;padding:var(--space-2) var(--gutter);display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;min-height:var(--topbar-h)}
.brand{display:flex;align-items:center;gap:var(--space-2);color:inherit;text-decoration:none;min-width:0}
.brand svg{flex:none}
.brand .logo{font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--text-lg);white-space:nowrap;letter-spacing:-0.01em;font-variation-settings:"opsz" var(--opsz-title)}
.brand .logo b{font-weight:inherit}
.brand .sub{font-size:var(--text-xs);color:var(--on-band-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.origin-pick{display:flex;align-items:center;gap:var(--space-2);font:var(--weight-semibold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--on-band-2);margin-right:auto}
.origin-pick select{height:30px;padding:0 var(--space-2);font:var(--weight-regular) var(--text-sm)/1 var(--font-sans);text-transform:none;letter-spacing:normal;color:var(--text)}
.tabs{display:flex;gap:2px;background:transparent;padding:3px;border-radius:var(--radius-md);max-width:100%;overflow-x:auto;border:1px solid var(--band-line)}
.tab{border:none;background:transparent;height:30px;padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--on-band-2);font-size:var(--text-sm);white-space:nowrap;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
@media (hover:hover) and (pointer:fine){.tab:hover{color:var(--on-band)}}
.tab.active{background:var(--band-line);color:var(--on-band);box-shadow:inset 0 0 0 1px var(--on-band-2);font-weight:var(--weight-medium)}
.icon-btn,.lang-btn,.gh{display:inline-flex;align-items:center;justify-content:center;height:30px;min-width:30px;padding:0 var(--space-2);border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--on-band-2);font-size:var(--text-sm);font-weight:var(--weight-medium);text-decoration:none;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover,.lang-btn:hover,.gh:hover{background:var(--band-line);color:var(--on-band)}}

.wrap{max-width:var(--content-max);margin:0 auto;padding:var(--space-5) var(--gutter)}

/* ===== the finding (first screen) ===== */
.finding{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:var(--space-5);margin-bottom:var(--space-4)}
.finding .eyebrow{font:var(--weight-semibold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:var(--space-2)}
.finding h1{font-size:var(--text-2xl);max-width:26ch}
.finding .lede{color:var(--text-2);font-size:var(--text-sm);margin:var(--space-2) 0 var(--space-4);max-width:var(--measure)}
.f-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
.f-cell{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-3);background:var(--bg);min-width:0}
.f-cell h2{font-size:var(--text-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-big{font:var(--weight-semibold) var(--text-3xl)/1.1 var(--font-mono);font-variant-numeric:tabular-nums;margin:var(--space-1) 0}
.f-meta{font:var(--weight-regular) var(--text-2xs)/1.5 var(--font-mono);color:var(--text-3)}
.f-cell .bar{margin-top:var(--space-2)}
.f-foot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-4);margin-top:var(--space-4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);height:var(--control-h);padding:0 var(--space-4);border-radius:var(--radius-sm);border:1px solid var(--border-input);background:var(--paper);color:var(--text);font-size:var(--text-sm);font-weight:var(--weight-medium);text-decoration:none;white-space:nowrap;transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--surface-hover)}}
.btn:active{transform:scale(var(--press-scale))}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (hover:hover) and (pointer:fine){.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}}
/* the button inside an empty state, beside a sentence rather than in a row of its own; height only, so the
   coarse-pointer rule above still raises it to the touch target on a phone */
.btn-sm{height:26px;padding:0 var(--space-3);font-size:var(--text-xs)}

.notice{border:1px solid var(--border);border-left:3px solid var(--warning);background:var(--surface);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);color:var(--text-2);margin-bottom:var(--space-4);max-width:none}
.notice b{color:var(--text)}
/* "nothing matched, here is why, here is the way back": a column, because the three children are a heading, a
   sentence and the button that undoes the filter. The text node between them becomes a flex item of its own. */
.empty-state{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-4) var(--space-2);text-align:center}

.ctrl{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-4)}
.seg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:var(--radius-md);max-width:100%;overflow-x:auto;border:1px solid var(--border)}
.seg button{border:none;background:transparent;height:28px;padding:0 var(--space-3);border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--text);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--border-input)}
select,input[type=search]{border:1px solid var(--border-input);background:var(--surface);color:var(--text);height:var(--control-h);padding:0 var(--space-3);border-radius:var(--radius-sm);font-size:var(--text-sm);max-width:100%}
input[type=search]{min-width:190px;flex:1 1 190px}
.lbl{font:var(--weight-semibold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3)}

.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--text-xs);color:var(--text-2);margin-bottom:var(--space-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:var(--space-1);vertical-align:-1px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:var(--space-3)}
.c-card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);background:var(--paper);box-shadow:var(--shadow-1);min-width:0}
.c-head{display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)}
.c-head h2{font-size:var(--text-md)}
.c-head .n{margin-left:auto;font:var(--weight-regular) var(--text-2xs)/1 var(--font-mono);color:var(--text-3)}
.bar{display:flex;height:12px;border-radius:var(--radius-xs);overflow:hidden;background:var(--surface-2);gap:1px}
.bar span{display:block}
.bar-k{display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2);font-size:var(--text-xs);color:var(--text-2)}
.bar-k b{font-family:var(--font-mono);color:var(--text);font-weight:var(--weight-semibold)}

table{width:100%;border-collapse:collapse;font-size:var(--text-sm);background:var(--surface)}
th{text-align:left;font:var(--weight-medium) var(--text-xs)/1.2 var(--font-sans);color:var(--text-2);background:var(--surface-2);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th.num,td.num{text-align:right}
@media (hover:hover) and (pointer:fine){th:hover{color:var(--text)}}
td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
@media (hover:hover) and (pointer:fine){tbody tr:hover{background:var(--surface-hover)}}
.tier{display:inline-flex;align-items:center;gap:3px;font:var(--weight-semibold) var(--text-2xs)/1 var(--font-mono);padding:2px 6px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
.tier::after{content:"";display:inline-block;width:18px;height:6px;border-radius:1px;background:linear-gradient(90deg,var(--text-2) var(--tier-fill),var(--border-strong) var(--tier-fill))}
.tier.R1{--tier-fill:100%}.tier.R2{--tier-fill:75%}.tier.R3{--tier-fill:50%}.tier.R4{--tier-fill:25%}
.sbar{position:relative;height:8px;border-radius:var(--radius-xs);background:var(--surface-2);min-width:80px}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--radius-xs);background:var(--o-stay)}
.sbar u{position:absolute;top:-2px;bottom:-2px;border-left:1px solid var(--text-2);border-right:1px solid var(--text-2);background:transparent;text-decoration:none}
#cmp-wrap td:first-child,#cmp-wrap th:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--border-strong)}
#cmp-wrap th:first-child{background:var(--surface-2)}
@media (hover:hover) and (pointer:fine){#cmp-wrap tbody tr:hover td:first-child{background:var(--surface-hover)}}
.cmp-hi{font-family:var(--font-mono);font-weight:var(--weight-semibold);color:var(--text)}
.cmp-n{font:var(--weight-regular) var(--text-2xs)/1.3 var(--font-mono);color:var(--text-3)}
.cmp-gap{font-family:var(--font-mono);font-size:var(--text-xs)}
.kindtag{display:inline-block;font-size:var(--text-2xs);padding:1px 6px;border-radius:var(--radius-xs);border:1px solid var(--border);color:var(--text-2);vertical-align:1px}
.muted{color:var(--text-2)}
.small{font-size:var(--text-xs)}
.only-s{display:none}

/* ===== compare chart ===== */
.chart{--ci-label:176px;--ci-val:96px;background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-4);box-shadow:var(--shadow-1)}
.chart-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);margin-bottom:var(--space-3)}
.chart-head h2{font-size:var(--text-md);margin-right:auto}
.ci-row{display:grid;grid-template-columns:var(--ci-label) minmax(0,1fr) var(--ci-val);align-items:center;gap:var(--space-3);min-height:28px;font-size:var(--text-sm)}
.ci-row .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-track{position:relative;height:18px;background:linear-gradient(90deg,var(--viz-grid) 1px,transparent 1px) 0 0/25% 100%;border-left:1px solid var(--viz-axis)}
.ci-track i{position:absolute;top:5px;height:8px;border-radius:2px;background:var(--o-stay)}
.ci-track u{position:absolute;top:2px;bottom:2px;border-left:1px solid var(--text);border-right:1px solid var(--text);text-decoration:none}
.ci-track u::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--text)}
.ci-val{text-align:right;font:var(--weight-regular) var(--text-xs)/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.ci-val small{display:block;color:var(--text-3);font-size:var(--text-2xs)}
.ci-axis{display:grid;grid-template-columns:var(--ci-label) minmax(0,1fr) var(--ci-val);gap:var(--space-3);font:var(--weight-regular) var(--text-2xs)/1 var(--font-mono);color:var(--text-3);margin-top:var(--space-1)}
.ci-axis .ticks{position:relative;height:1em}
.ci-axis .ticks b{position:absolute;top:0;transform:translateX(-50%);font-weight:var(--weight-regular)}
.ci-axis .ticks b:first-child{transform:none}
.ci-axis .ticks b:last-child{transform:translateX(-100%)}
.ci-cap{margin:var(--space-2) 0 0;font-size:var(--text-2xs);color:var(--text-3)}

.drawer{position:fixed;inset:0;z-index:var(--z-drawer);display:none}
.drawer.open{display:block}
.drawer .veil{position:absolute;inset:0;background:var(--overlay)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--surface-raised);border-left:1px solid var(--border);box-shadow:var(--shadow-2);overflow:auto;padding:var(--space-5)}
.drawer h2{font-size:var(--text-xl);margin-bottom:var(--space-1);padding-right:5em}
.close{position:absolute;right:var(--space-4);top:var(--space-4);border:1px solid var(--border-input);background:var(--surface);border-radius:var(--radius-sm);height:30px;padding:0 var(--space-3);font-size:var(--text-xs)}
.kv{display:flex;gap:var(--space-2) var(--space-3);flex-wrap:wrap;font-size:var(--text-xs);color:var(--text-2);margin:var(--space-2) 0 var(--space-4)}
.kv span{white-space:nowrap}
.sec-t{font:var(--weight-semibold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3);margin:var(--space-5) 0 var(--space-2)}

.ask{border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4);background:var(--paper);margin-bottom:var(--space-4)}
.ask-row{display:flex;gap:var(--space-3);flex-wrap:wrap}
.ask-row label{display:flex;flex-direction:column;gap:var(--space-1);font:var(--weight-semibold) var(--text-2xs)/1.2 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3);flex:1 1 190px;min-width:0}
.ask-row select{width:100%;text-transform:none;letter-spacing:normal;font-weight:var(--weight-regular)}
.ask-note{margin:var(--space-3) 0 0;font-size:var(--text-xs);color:var(--text-2);max-width:var(--measure)}
.ask-note b{color:var(--text)}
.m-card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);background:var(--paper);box-shadow:var(--shadow-1);margin-bottom:var(--space-2);display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;cursor:pointer}
@media (hover:hover) and (pointer:fine){.m-card:hover{background:var(--surface-hover)}}
.m-rank{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-3);min-width:26px}
.m-main{flex:1 1 220px;min-width:0}
.m-main h3{font-size:var(--text-md)}
.m-num{text-align:right;min-width:96px}
.m-num .big{font:var(--weight-semibold) var(--text-xl)/1.1 var(--font-mono);color:var(--text)}
.m-num .sub{font-size:var(--text-2xs);color:var(--text-3);font-family:var(--font-mono)}
/* the view's title, as on Bill's and Callback Desk's pages; Path Finder keeps its finding card's title instead (ruling
   2026-09-16 20:38: the skip link and the focus fallback need a visible heading that names the view) */
.view-h{font-size:var(--text-xl);font-weight:var(--weight-semibold);margin:0 0 var(--space-3)}
.notice > p,.warn > p{margin:0;max-width:var(--measure)}   /* the box keeps the column width; the sentences keep a readable measure */
#venue-wrap > p{max-width:var(--measure)}
/* a focusable table row draws its ring inside itself: outside, the table's scroll box clipped it and the sticky header covered
   its top, so a focused row showed no ring at all (found 2026-09-16 with the ring check after closing the drawer) */
tbody tr[tabindex]:focus-visible{outline-offset:-2px}
.warn{border-left:3px solid var(--warning);background:var(--surface);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);color:var(--text-2);margin-bottom:var(--space-3)}
.doc{max-width:var(--measure)}
.doc h2{font-size:var(--text-lg);margin:var(--space-5) 0 var(--space-2)}
.doc p,.doc li{color:var(--text);font-size:var(--text-md)}
.doc code{font-family:var(--font-mono);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:var(--radius-xs)}
.doc ul{padding-left:20px}
.pipe{list-style:none;margin:var(--space-3) 0 var(--space-2);padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-2);counter-reset:pipe}
.pipe li{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--paper);box-shadow:var(--shadow-1);padding:var(--space-3);display:grid;align-content:start;gap:var(--space-1);font-size:var(--text-sm);min-width:0}
.pipe li::before{counter-increment:pipe;content:counter(pipe);font:var(--weight-semibold) var(--text-2xs)/1 var(--font-mono);color:var(--text-3)}
.pipe li span{font-size:var(--text-xs);color:var(--text-2);overflow-wrap:anywhere}
.pipe li code{font-size:var(--text-xs)}
.pipe-note,.dl-all{font-size:var(--text-sm);color:var(--text-2)}
#loading{padding:var(--space-4) 0}

/* ===== footer (honest block) ===== */
.honest{border-top:1px solid var(--band-line);font-size:var(--text-xs);color:var(--on-band-2);background:var(--band);padding:var(--space-10) var(--gutter) var(--space-12)}
.honest dl{margin-block:0}
.honest dt{font-weight:var(--weight-semibold);color:var(--on-band);font-family:var(--font-sans);font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin-bottom:var(--space-2)}
.honest dd{margin:0;max-width:var(--measure);line-height:var(--leading-relaxed)}
.foot{font:var(--weight-regular) var(--text-2xs)/1.5 var(--font-mono);color:var(--text-3);margin-bottom:var(--space-3)}

@media (max-width:900px){
  .f-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .wrap{padding:var(--space-3) var(--gutter)}
  .tb-in{gap:var(--space-2)}
  .brand .sub{display:none}
  .origin-pick{margin-right:auto}
  .tabs{order:9;flex:1 1 100%}
  .hide-s{display:none}
  .only-s{display:block}
  table{font-size:var(--text-xs)}
  td,th{padding:var(--space-2)}
  .drawer .panel{padding:var(--space-4)}
  .finding{padding:var(--space-4)}
  .finding h1{font-size:var(--text-xl)}
  .f-big{font-size:var(--text-2xl)}
  .chart{--ci-label:96px;--ci-val:64px}
  .ci-row,.ci-axis{gap:var(--space-2)}
  .gh{display:none}
}
/* ===== Family layer v3.1: band surfaces, pressed and focus states, touch targets =====
   The band (top bar, signature panel, footer) is the anchor surface: deep in Plaster and Ink, a whiter paper in
   Paper. Everything on it uses the --on-band pair; focus rings and text selection get their own colours there
   because --focus and --selection-bg are solved for light surfaces. Hover sits behind (hover:hover) so a tap on
   a touch screen does not leave a stuck highlight. */
.topbar .pill{border-color:var(--band-line);color:var(--on-band-2);background:transparent;font-weight:var(--weight-regular)}
.topbar .pill::before{background:var(--warning)}
.topbar .btn,.plate .btn{background:transparent;border-color:var(--band-line);color:var(--on-band)}
.topbar .btn-ghost,.plate .btn-ghost{border-color:transparent}
.topbar .btn-primary,.plate .btn-primary{background:var(--on-band);border-color:var(--on-band);color:var(--band)}
@media (hover:hover) and (pointer:fine){
  .topbar .btn:hover,.plate .btn:hover{background:var(--band-line);border-color:var(--band-line)}
  .topbar .btn-primary:hover,.plate .btn-primary:hover{background:var(--on-band-2);border-color:var(--on-band-2)}
}
.topbar :focus-visible,.plate :focus-visible,.honest :focus-visible{outline-color:var(--on-band)}
/* Focus scrolls clear of the sticky top bar: a control reached by Tab, or <main> after the skip link, never lands under
   the bar (round-1 audits, 2026-09-16: the ring of <main> and most of a button sat behind it). A product whose sticky
   chrome is taller than the bar, or wraps, sets --sticky-top to its measured height. */
html{scroll-padding-top:calc(var(--sticky-top,var(--topbar-h)) + var(--space-3))}
/* Native checkboxes and radios take the palette's accent instead of the browser's blue (ruling 2026-09-16 20:11 Q4:
   checked fill against its surface 4.55–16.17:1, tick against the fill 4.71–16.34:1 across the three palettes, light and dark). */
:root{accent-color:var(--accent)}
.topbar ::selection,.plate ::selection,.honest ::selection{background:var(--on-band-2);color:var(--band)}
.honest-in{max-width:var(--content-max);margin:0 auto;display:grid;gap:var(--space-6);grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.honest a{color:var(--on-band);text-decoration-color:var(--band-line)}
.honest code{color:var(--on-band)}
/* Pressed: the whole control scales, content included (reads as pushed in, not moved). Reduced motion keeps a
   colour change instead of the scale. */
.seg button:active,.tab:active,.icon-btn:active,.lang-btn:active,.close:active{transform:scale(var(--press-scale))}
@media (prefers-reduced-motion:reduce){.btn:active,.seg button:active,.tab:active,.icon-btn:active,.lang-btn:active,.close:active{transform:none;background:var(--neutral-tint)}}
/* Touch: 44px targets on coarse pointers. */
@media (pointer:coarse){.btn,.nav a{min-height:var(--touch-min)}.btn-icon{min-width:var(--touch-min)}}
/* Text fields: the edge darkens and a same-hue ring appears; the outline is for keyboard focus. */
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),select,textarea{transition:border-color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-tint)}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):focus-visible,select:focus-visible,textarea:focus-visible{outline:var(--border-focus-width) solid var(--focus);outline-offset:1px}
::placeholder{color:var(--text-3)}
/* Numeric columns: header text and figures share one right edge, by rule rather than by accident. */
table.data th.num,table.data td.num{text-align:right}
table.data th.num button{justify-content:flex-end;width:100%}
/* Scholar Outflow Lab: view tabs, language and icon buttons sit on the band */
.honest .foot{color:var(--on-band-2)}
/* phone width: brand, language and light/dark share the first row; origin and the view tabs get full rows */
@media (max-width:720px){
  .brand{flex:1 1 auto}
  .lang-btn,.icon-btn{order:1}
  .origin-pick{order:2;flex:1 1 100%;margin-right:0}
  .origin-pick select{flex:1 1 auto;min-width:0}
  .tabs{order:9}
}
@media (max-width:767px){#theme{display:none}}
#nl-settings-button{flex:none}
/* touch: the bar's own controls reach 44px too (the family rule only knows .btn / .nav a) */
@media (pointer:coarse){.tab,.icon-btn,.lang-btn,.gh{min-height:var(--touch-min)}.icon-btn{min-width:var(--touch-min)}}
@media (pointer:coarse){.origin-pick select{height:var(--touch-min)}}   /* the origin picker was 30px tall beside 44px neighbours */
/* ===== end of family layer v3.1 ===== */
</style>
</head>

<header class="topbar"><div class="tb-in">

  <a class="gh" href="https://github.com/NickkkLian/Scholar-Outflow-Lab" rel="noopener">GitHub</a>

<main class="wrap" id="main" tabindex="-1">
  <h1 class="view-h" id="view-h" hidden></h1>
  <section class="finding" id="finding" hidden aria-labelledby="finding-h">
    <div class="eyebrow" id="finding-eyebrow"></div>

    </div>
  </section>
  <div class="notice" id="notice"></div>

  <!-- Path finder -->

    <div class="ask">
      <div class="ask-row">
        <label><span id="l-mfield"></span>
          <select id="m-field"></select>
        </label>
        <label><span id="l-mcountry"></span>
          <select id="m-country"></select>
        </label>
        <label><span id="l-mkind"></span>
          <select id="m-kind"></select>
        </label>
        <label><span id="l-mstratum"></span>
          <select id="m-stratum"></select>
        </label>
      </div>

    <div id="match-summary"></div>

      <span class="lbl" id="l-stratum2"></span>
      <div class="seg" id="seg-stratum2" role="group" aria-labelledby="l-stratum2"></div>
      <select id="f-kind"></select>
      <select id="f-country"></select>
      <select id="f-field"></select>
      <input type="search" id="f-q" />

    <div id="inst-coverage"></div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th data-sort="rank">#</th>
          <th data-sort="name" id="th-name"></th>
          <th data-sort="country" class="hide-s" id="th-country"></th>
          <th data-sort="stay" class="num" id="th-stay"></th>
          <th class="hide-s" id="th-ci"></th>
          <th data-sort="dual" class="num hide-s" id="th-dual"></th>
          <th data-sort="ret" class="num hide-s" id="th-ret"></th>
          <th data-sort="n" class="num" id="th-n"></th>
        </tr></thead>
        <tbody id="inst-body"></tbody>
      </table>
    </div>

  <!-- Origin comparison -->
  <section id="v-compare" hidden>

      <span class="lbl" id="l-stratum3"></span>
      <div class="seg" id="seg-stratum3" role="group" aria-labelledby="l-stratum3"></div>

  <!-- Venues -->

    <div class="ctrl">
      <select id="v-field"></select>
      <select id="v-type"></select>

  <!-- Methodology -->

</main>

<script>
/* ── i18n ─────────────────────────────────────────────────────────────
   Default is English; the toggle persists in localStorage.
   Data files keep their original (Chinese) labels — the pipeline is
   untouched. English labels are derived client-side:
   countries via Intl.DisplayNames from the ISO code that every record
   already carries, fields/caveats/notes via the finite dictionaries
   below (unknown strings fall back to the original text, visibly,
   rather than being hidden). */
const LANG_KEY = 'sol-lang';
let LANG = localStorage.getItem(LANG_KEY) || 'en';

const FIELD_EN = {
  '人文艺术':'Arts & Humanities','免疫微生物':'Immunology & Microbiology','兽医':'Veterinary',
  '农业生物':'Agricultural & Biological Sciences','决策科学':'Decision Sciences','化学':'Chemistry',
  '化工':'Chemical Engineering','医学':'Medicine','卫生职业':'Health Professions','口腔':'Dentistry',
  '商管':'Business & Management','地球科学':'Earth & Planetary Sciences','工程':'Engineering',
  '心理学':'Psychology','护理':'Nursing','数学':'Mathematics','材料':'Materials Science',
  '物理天文':'Physics & Astronomy','环境科学':'Environmental Science',
  '生化遗传':'Biochemistry & Genetics','社会科学':'Social Sciences','神经科学':'Neuroscience',
  '经济金融':'Economics & Finance','能源':'Energy','药学':'Pharmacology & Toxicology','计算机':'Computer Science'
};
// Keyed by a stable prefix of the Chinese sentence emitted by compute.py, so a
// wording tweak upstream degrades to showing the original text instead of lying.
const CAVEAT_EN = [
  ['学术履历代理指标','A proxy built from academic affiliation records — not official visa/immigration statistics, and not immigration or legal advice'],
  ['只覆盖在 OpenAlex','Covers only researchers with authorship records in OpenAlex — not representative of students or skilled migrants overall'],
  ['样本框是「曾在来源国机构署名发表」','The sample frame is people who once published under an origin-country affiliation — those who left before ever publishing at home are simply not in it'],
  ['「留下」= 最后已知署名机构','"Stayed" means the last known affiliation is in that country — it does not mean a work permit or permanent residency'],
  ['「双挂」= 末位同时挂','"Dual" means the final affiliations span both the destination and the origin; very common among Chinese researchers, kept separate so neither side is inflated'],
  ['只统计到达年','Only arrivals early enough to allow a 5-year observation window are counted'],
  ['在目的机构须跨 ≥2 个年份','An affiliation must span ≥2 calendar years to count as "arrived"; 2–3-year stints are mostly visiting scholars — always read with the stay-length strata'],
  ['起步那年就已挂在该国','People already affiliated with the destination in their first year are not counted as movers — otherwise lifelong locals would look like migrants who stayed'],
  ['机构由 OpenAlex 从署名字符串','Institutions are parsed by OpenAlex from affiliation strings; filtered through a ROR + output whitelist, but mismatches remain'],
  ['榜单含高校与研究所','The board includes universities and research institutes (CAS / CNRS / NIH / Academia Sinica etc.). Institute records are noisier — see the whitelist notes in the repo'],
  ['学科取自作者最高频 topic','Field labels come from each author\'s most frequent OpenAlex topic and are coarse — much of computer science lands under "Engineering", so the CS slice under-covers institutions; a classification artifact, not a data gap'],
  ['绝对值会随口径漂移','Absolute values drift with sampling choices — only compare institutions/countries against each other'],
];
const NOTE_EN = [
  ['只收录产出 ≥2000 篇','Only venues with ≥2,000 indexed works are included'],
  ['只收录 h-index ≥5','Only venues with h-index ≥5 — without the floor, uncited trade magazines flood in and dilute every percentile line'],
  ['分级 V1–V4','V1–V4 are within-field h-index percentiles; comparing h-index across fields is meaningless, so there is no site-wide banding'],
  ['OA / DOAJ 标记','OA / DOAJ flags are informational only and say nothing about APC costs'],
];
const ORIGIN_EN = {cn:'Mainland China'};
let dnEN = null; try { dnEN = new Intl.DisplayNames(['en'], {type:'region'}); } catch(e){}

const enCountry = (cc, fallback) => {
  if(ORIGIN_EN[cc]) return ORIGIN_EN[cc];
  try { const n = dnEN && dnEN.of(String(cc).toUpperCase()); if(n && n !== String(cc).toUpperCase()) return n; } catch(e){}
  return fallback;
};
const country = (cc, zhName) => LANG === 'en' ? enCountry(cc, zhName) : zhName;
const field = f => LANG === 'en' ? (FIELD_EN[f] || f) : f;
const caveat = c => LANG === 'en' ? ((CAVEAT_EN.find(([p]) => c.startsWith(p)) || [,c])[1]) : c;
const vnote = n => LANG === 'en' ? ((NOTE_EN.find(([p]) => n.startsWith(p)) || [,n])[1]) : n;
const vtype = t => LANG === 'en' ? ({'期刊':'Journal','会议':'Conference'}[t] || t) : t;

const T = {
en: {
  title:'Scholar Outflow Lab · Where home-grown researchers end up',
  brandLogo:'Scholar Outflow <b>Lab</b>', brandSub:'Where researchers from 13 countries ended up — every rate shown with its sample size.',
  skip:'Skip to content',
  fEyebrow:'The finding', fTitle:'Same destination, different starting points',
  fLede:'Researchers who started publishing in each country and later spent four or more years in the United States — the share whose last known affiliation is still there. Same sampling, same computation; compare relative levels, not the absolute percentages.',
  fStay:'stayed in the US', fMeta:(n,ci)=>`n = ${n.toLocaleString()}<br>95% CI ${ci}`,
  fCta:'Compare all origins', fLoading:'Loading the four origins…', fFail:m=>`The headline figures could not be loaded (${m}). The rest of the page does not depend on them.`, tryAgain:'Try again',
  cmpChartTitle:(dest,s)=>`Stay rate in ${dest} by starting country · ${s}`, cmpChartDest:'Destination', cmpChartAxis:'Bar: stay rate. Whisker: 95% confidence interval. Sorted by stay rate.',
  hAboutT:'About this data', hAbout:'Every number is computed by scripts/compute.py from OpenAlex authorship records (CC0) and served as static JSON; nothing is modelled or estimated by hand. The pipeline, its tests and the three corrections that made the numbers self-consistent are in the repository.',
  hNvT:'Not verified here', hNv:'Not visa or immigration statistics and not advice. The sample frame excludes anyone who left before publishing at home; "stayed" means the last known affiliation, not residency. Institutions are parsed from affiliation strings and some mismatches remain; field labels are coarse. Absolute values drift with sampling choices.',
  hSrcT:'Source', hSrc:'MIT · data OpenAlex, CC0 · built by Nick Lian',
  origin:'Origin', langBtn:'中文',
  tabs:{match:'Path Finder',country:'Destinations',inst:'Institutions',compare:'Origin Compare',venue:'Venues',doc:'Methodology'},
  darkMode:'Dark mode', settingsBtn:'Settings',
  notice:`<b>This is not immigration advice, and not visa statistics.</b>
    The data is a migration proxy built from academic authorship records and covers only people who publish;
    "stayed" means the last known affiliation is in that country, not a work permit or permanent residency.
    Absolute values are sensitive to sampling — <b>only compare institutions, countries and origins against each other</b>.
    Full definitions on the Methodology page.`,
  loading:'Loading data…', loadFail:(m)=>`Failed to load data: ${m} (serve over http locally, e.g. python3 -m http.server)`,
  cmpFail:(names,m)=>`Could not load ${names} (${m}). The table compares every origin, so it waits for all of them.`,
  strata:{short:'2–3 yrs (mostly visiting)',long:'≥4 yrs (default)',long6:'≥6 yrs',all:'Any length'},
  out:{stay:'Stayed',dual:'Dual',ret:'Returned',onward:'Onward'},
  legend:{stay:'Stayed (final affiliation only in destination)',dual:'Dual (both sides)',ret:'Returned (only origin)',onward:'Onward (third country)'},
  stayLen:'Stay length',
  lMField:'My field', lMCountry:'Destination', lMKind:'Institution type', lMStratum:'Planned stay',
  kindOpts:['Universities + institutes','Universities only','Institutes only'],
  mStratumOpts:{long:'4+ years (PhD / long-term role)',long6:'6+ years (putting down roots)',short:'2–3 years (visiting / joint program)',all:'Any length'},
  askNote:`Ranked by the <b>lower bound of the 95% CI on the stay rate</b>, not the raw rate —
    40% of a 25-person sample doesn't hold up, and ranking by the bound lets it sink on its own.
    <b>Sample sizes are printed; read them.</b>`,
  anyDest:'Any destination', anyFieldOverall:'Any field (overall)',
  allCountries:'All countries/regions', allFields:'All fields',
  fKindLbl:'Institution type', fCountryLbl:'Country or region', fFieldLbl:'Field', vFieldLbl:'Field', vTypeLbl:'Venue type',
  searchInst:'Search institutions…', searchVenue:'Search venues / publishers…',
  instCount:n=>n === 1 ? '1 institution' : `${n} institutions`, venueCount:(n,total)=>n < total ? `${n} of ${total.toLocaleString('en')} venues` : n === 1 ? '1 venue' : `${n} venues`,
  instEmptyT:'No institutions match.', instEmpty:'Loosen the filters, or try another stay-length stratum.', clearFilters:'Clear filters',
  venueEmptyT:'No venues match.', venueEmpty:'Loosen the field, type or search filter.',
  th:{name:'Institution',country:'Country/Region',stay:'Stay rate',ci:'95% CI',dual:'Dual',ret:'Returned',n:'n'},
  smallN:' · small n',
  noCountriesT:'No destination to show.', noCountries:'No destination country has enough sample in this stratum.', showDefaultStratum:'Show ≥4 yrs (default)',
  instituteTag:'Institute',
  vTypeOpts:['Journals + conferences','Journals only','Conferences only'],
  venueTh:{tier:'Tier',name:'Venue',pub:'Publisher',h:'h-index',imp:'2-yr cites/paper',works:'Works',rank:'Rank in field'},
  venueBuilding:`<div class="warn"><p>This page is still being filled in.<br>
    The venue board is regrouped by field and the data source has a daily free-tier quota, so it lands in batches —
    it will appear here as soon as it's complete.<br>
    <span class="small">Method and progress are public in the
    <a href="https://github.com/NickkkLian/Scholar-Outflow-Lab" target="_blank" rel="noopener">GitHub repo</a>.</span></div>`,
  cmpOnlyOne:`<div class="warn"><p>Only one origin country has data — nothing to compare yet.
    More origins are harvested day by day (the data source has a daily free quota); this page appears by itself once they land.</p></div>`,

const t = k => T[LANG][k];

// Deep links: #compare, #inst, … open that view directly (and the tab bar keeps the hash in sync).
const VIEWS = ['match','country','inst','compare','venue','doc'];
const [hashView, hashQuery] = location.hash.slice(1).split('?');
// the rest of a deep link (#inst?kind=edu&q=toronto, #venue?type=journal …) is applied once, after the first data load
const HASH_STATE = new URLSearchParams(hashQuery || '');
const S = {data:null, venues:null, origin:(/^[a-z]{2}$/.test(HASH_STATE.get('origin') || '') ? HASH_STATE.get('origin') : 'cn'), originList:null, allData:{}, cmpDest:null,
           view: VIEWS.includes(hashView) ? hashView : 'match', stratum:'long', sortKey:'stay', sortDir:-1,
           fCountry:'', fField:'', fKind:'', q:'',
           mField:'', mCountry:'', mKind:'', mStratum:'long',
           vField:'', vType:'', vQ:'', vSortKey:'h', vSortDir:-1, cSortKey:null, cSortDir:0};
const OUT_KEYS = [['stay','var(--o-stay)'],['dual','var(--o-dual)'],['ret','var(--o-ret)'],['onward','var(--o-onward)']];
const pc = v => v==null ? '—' : (v*100).toFixed(1)+'%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// meta.origin_name arrives in Chinese from the data files; display per language.
const originName = m => country(m.origin, m.origin_name);

// render() does not rebuild these buttons, so the highlight stayed on the old stratum until a reload (round-1 audit); every
// pick rebuilds the three groups, marks the pick with aria-pressed, and keeps focus on the button that was pressed
function stratumSeg(el, onPick){
  el.innerHTML = ['short','long','long6','all'].map(k =>
    `<button type="button" data-k="${k}" class="${k===S.stratum?'on':''}" aria-pressed="${k===S.stratum}">${t('strata')[k]}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if(!b) return;
    const hadFocus = el.contains(document.activeElement);
    S.stratum = b.dataset.k;
    ['seg-stratum','seg-stratum2','seg-stratum3'].forEach(id => stratumSeg(document.getElementById(id)));
    render(); syncHash(); onPick && onPick();
    if(hadFocus){ const again = el.querySelector(`button[data-k="${S.stratum}"]`); if(again) again.focus(); } };
}

function stackBar(s){
  const parts = OUT_KEYS.map(([k,c]) => s[k] ? `<span style="width:${s[k]*100}%;background:${c}"></span>` : '').join('');
  const keys = OUT_KEYS.map(([k]) => `<span>${t('out')[k]} <b>${pc(s[k])}</b></span>`).join('');
  return `<div class="bar">${parts}</div><div class="bar-k">${keys}</div>`;
}

function renderCountries(){
  const g = document.getElementById('country-grid');
  const rows = S.data.countries
    .map(c => ({c, s:c.strata[S.stratum]}))
    .filter(x => x.s && x.s.n >= 60)
    // Default sort is sample size, not stay rate: small-n countries (n<150) have
    // noisy rates, and letting them top the board treats noise as a conclusion.
    .sort((a,b) => b.s.n - a.s.n);
  g.innerHTML = rows.map(({c,s}) => `
    <div class="c-card">
      <div class="c-head"><h2>${esc(country(c.cc, c.name))}</h2>
        <span class="n">n=${s.n}${s.n < 150 ? t('smallN') : ''}</span></div>
      ${stackBar(s)}
    </div>`).join('');
  if(!rows.length){ const p = document.createElement('p'); p.className = 'muted';
    p.append(emptyState('noCountriesT', 'noCountries', () => { S.stratum = 'long'; ['seg-stratum','seg-stratum2','seg-stratum3'].forEach(id => stratumSeg(document.getElementById(id))); render(); syncHash(); document.querySelector('#seg-stratum button[data-k="long"]').focus(); }, 'showDefaultStratum'));
    g.replaceChildren(p); }
}

function instRows(){
  return S.data.institutions
    .map(it => ({it, s:it.strata[S.stratum]}))
    .filter(({it,s}) => s && s.n >= S.data.meta.min_n_inst
      && (!S.fKind || (it.kind || 'edu') === S.fKind)
      && (!S.fCountry || it.cc === S.fCountry)
      && (!S.fField || ((it.fields||{})[S.stratum]||[]).some(f => f.field === S.fField))
      && (!S.q || it.name.toLowerCase().includes(S.q.toLowerCase())))
    .sort((a,b) => {
      const k = S.sortKey;
      const va = k==='rank'? a.it.rank : k==='name'? a.it.name : k==='country'? country(a.it.cc, a.it.country) : a.s[k];
      const vb = k==='rank'? b.it.rank : k==='name'? b.it.name : k==='country'? country(b.it.cc, b.it.country) : b.s[k];
      if(typeof va === 'string') return S.sortDir * va.localeCompare(vb, LANG==='zh'?'zh':'en');
      return S.sortDir * (((va??-1)) - ((vb??-1)));
    });
}

// When few institutions qualify, say why — otherwise it reads as a broken site.
// Measured: qualifying-institution counts track mover counts almost exactly —
// Indonesia 3.9% movers → 7 institutions, China 13.1% → 175.
function coverageNote(){
  const m = S.data && S.data.meta;
  if(!m) return '';
  const n = (S.data.institutions || []).length;
  if(n >= 40) return '';
  const rate = m.mover_rate != null ? pc(m.mover_rate) : '—';
  const md = Object.assign({}, m, {origin_name_disp: originName(m)});
  return `<div class="warn"><p>${t('covNote')(md, n, rate)}</p></div>`;
}

function setTh(id, text){ const el = document.getElementById(id); (el.querySelector('.th-sort') || el).textContent = text; }
function emptyState(titleKey, reasonKey, onClear, labelKey){
  const b = document.createElement('b'); b.textContent = t(titleKey);
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn btn-sm'; btn.textContent = t(labelKey || 'clearFilters'); btn.onclick = onClear;
  // a span, not a div: it also sits inside the <p id="inst-empty">
  const box = document.createElement('span'); box.className = 'empty-state'; box.append(b, ' ' + t(reasonKey) + ' ', btn); return box;
}
// the Clear filters button lives in the empty state and disappears once rows are back; focus goes to the search box, not <body>
function clearInstFilters(){ S.fKind = S.fCountry = S.fField = S.q = ''; ['f-kind','f-country','f-field','f-q'].forEach(id => { document.getElementById(id).value = ''; }); renderInsts(); syncHash(); document.getElementById('f-q').focus(); }
function clearVenueFilters(){ S.vField = S.vType = S.vQ = ''; ['v-field','v-type','v-q'].forEach(id => { document.getElementById(id).value = ''; }); renderVenues(); syncHash(); document.getElementById('v-q').focus(); }
let drawerOpener = null;
// the drawer is a modal dialog: while it is open the rest of the page is inert (Tab cannot reach it, clicks do not land),
// Tab and Shift+Tab wrap inside the panel, and the open institution is in the address. Before, Tab walked out of the open
// drawer onto the top bar under the veil, and axe counted the drawer as content outside any landmark (round-1 audit).
const pageParts = () => [...document.body.children].filter(el => el.id !== 'drawer' && el.tagName !== 'SCRIPT');
function closeDrawer(){ const d = document.getElementById('drawer'); if(!d.classList.contains('open')) return; d.classList.remove('open');
  pageParts().forEach(el => { el.inert = false; });
  const id = S.openInst; S.openInst = null; syncHash();
  // opened from a shared link there was no opener (focus was on <body>): go to the institution's row or card instead
  const back = drawerOpener && drawerOpener !== document.body && document.contains(drawerOpener) ? drawerOpener : id && document.querySelector(`#v-${S.view} [data-id="${CSS.escape(id)}"]`);
  if(back) back.focus(); else document.getElementById('main').focus();
  drawerOpener = null; }
function trapDrawer(e){
  if(e.key !== 'Tab' || !document.getElementById('drawer').classList.contains('open')) return;
  const f = [...document.querySelectorAll('#drawer .panel button, #drawer .panel a[href]')].filter(x => x.getClientRects().length);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && (document.activeElement === first || !f.includes(document.activeElement))){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && (document.activeElement === last || !f.includes(document.activeElement))){ e.preventDefault(); first.focus(); }
}
function syncHash(){
  const q = new URLSearchParams();
  if(S.origin !== 'cn') q.set('origin', S.origin);
  if(S.stratum !== 'long' && ['country','inst','compare'].includes(S.view)) q.set('stratum', S.stratum);
  if(S.view === 'inst'){ if(S.fKind) q.set('kind', S.fKind); if(S.fCountry) q.set('country', S.fCountry); if(S.fField) q.set('field', S.fField); if(S.q) q.set('q', S.q); }
  if(S.view === 'venue'){ if(S.vField) q.set('field', S.vField); if(S.vType) q.set('type', S.vType); if(S.vQ) q.set('q', S.vQ); }
  // Path Finder's four questions, the compare chart's destination and the open institution belong to the view too (v1 §9.14)
  if(S.view === 'match'){ if(S.mField) q.set('field', S.mField); if(S.mCountry) q.set('dest', S.mCountry); if(S.mKind) q.set('kind', S.mKind); if(S.mStratum !== 'long') q.set('stay', S.mStratum); }
  if(S.view === 'compare' && S.cmpDestPicked && S.cmpDest) q.set('dest', S.cmpDest);
  if(S.openInst && (S.view === 'inst' || S.view === 'match')) q.set('open', S.openInst);
  // sort state in the address too, so a shared link opens with the same row order; the default order is not written
  const dirName = d => d === 1 ? 'asc' : 'desc';
  if(S.view === 'inst' && !(S.sortKey === 'stay' && S.sortDir === -1)) q.set('sort', S.sortKey + ':' + dirName(S.sortDir));
  if(S.view === 'venue' && !(S.vSortKey === 'h' && S.vSortDir === -1)) q.set('sort', S.vSortKey + ':' + dirName(S.vSortDir));
  if(S.view === 'compare' && S.cSortKey) q.set('sort', S.cSortKey + ':' + dirName(S.cSortDir));
  const qs = q.toString();
  history.replaceState(null, '', S.view === 'match' && !qs ? location.pathname + location.search : '#' + S.view + (qs ? '?' + qs : ''));
}
function applyHashState(){
  const g = k => HASH_STATE.get(k) || '';
  if(['short','long','long6','all'].includes(g('stratum'))) S.stratum = g('stratum');
  const set = (id, v) => { const el = document.getElementById(id); if(el){ el.value = v; return el.value; } return v; };
  if(S.view === 'inst'){ S.fKind = set('f-kind', g('kind')); S.fCountry = set('f-country', g('country')); S.fField = set('f-field', g('field')); S.q = set('f-q', g('q')); }
  if(S.view === 'venue'){ S.vType = set('v-type', g('type')); S.vQ = set('v-q', g('q')); S.vField = g('field'); if(S.venues) S.vField = set('v-field', S.vField); }
  if(S.view === 'match'){ S.mField = set('m-field', g('field')); S.mCountry = set('m-country', g('dest')); S.mKind = set('m-kind', g('kind'));
    if(['short','long','long6','all'].includes(g('stay'))) S.mStratum = set('m-stratum', g('stay')); }

/* ---- Path finder ---- */
function matchRows(){
  const k = S.mStratum, f = S.mField, cc = S.mCountry;
  return S.data.institutions.map(it => {
    const s = it.strata[k];
    if(!s || !s.n) return null;
    if(cc && it.cc !== cc) return null;
    if(S.mKind && (it.kind || 'edu') !== S.mKind) return null;
    if(!f) return {it, s, scoped:false};
    // If a field is chosen, use that field's numbers in the SAME stratum — never
    // fall back to the overall numbers and pretend they're field-scoped.
    const fs = (it.fields[k] || []).find(x => x.field === f);
    return fs ? {it, s:fs, scoped:true} : null;
  }).filter(Boolean)
    .sort((a,b) => (b.s.stay_lb ?? -1) - (a.s.stay_lb ?? -1));
}

/* ---- Origin comparison: same destination, different starting points ---- */
function renderCompare(){
  const wrap = document.getElementById('cmp-wrap');
  const list = S.originList || [];
  if(list.length < 2){
    wrap.innerHTML = t('cmpOnlyOne');
    document.getElementById('cmp-chart').innerHTML = '';
    return;
  }
  const missing = list.filter(o => !S.allData[o.cc]);
  const failed = missing.filter(o => S.originErr && S.originErr[o.cc]);
  if(failed.length){
    // a file that did not load used to leave "Loading per-origin data…" on screen for good (round-1 audit)
    document.getElementById('cmp-chart').innerHTML = '';
    wrap.innerHTML = `<div class="warn" role="alert"><p>${esc(t('cmpFail')(failed.map(o => country(o.cc, o.name)).join(', '), failed.map(o => S.originErr[o.cc]).join('; ')))}
      <button type="button" class="btn btn-sm" id="cmp-retry">${t('tryAgain')}</button></p></div>`;
    document.getElementById('cmp-retry').onclick = () => { S.originErr = {}; renderCompare(); ensureAllOrigins().then(() => { const b = document.getElementById('cmp-retry') || document.querySelector('#cmp-wrap .th-sort'); if(b) b.focus(); }); };
    return;
  }
  if(missing.length){
    wrap.innerHTML = `<p class="muted">${t('cmpLoading')}</p>`;
    return;
  }
  const k = S.stratum;
  // Only destinations where ≥2 origins qualify — otherwise the row is mostly blanks.
  const rows = [];
  const ccs = new Set();
  list.forEach(o => (S.allData[o.cc].countries || []).forEach(c => ccs.add(c.cc)));
  ccs.forEach(dc => {
    const cells = list.map(o => {
      const c = (S.allData[o.cc].countries || []).find(x => x.cc === dc);
      const st = c && c.strata[k];
      return (st && st.n >= 60) ? {name: c.name, ...st} : null;
    });
    if(cells.filter(Boolean).length >= 2){
      const vals = cells.filter(Boolean).map(c => c.stay);
      rows.push({dc, name: (cells.find(Boolean) || {}).name || dc, cells,
                 total: cells.reduce((a,c) => a + (c ? c.n : 0), 0),
                 gap: Math.max(...vals) - Math.min(...vals)});
    }
  });
  rows.sort((a,b) => b.total - a.total);

  document.getElementById('cmp-note').textContent = t('cmpNote')(rows.length, list.length);
  renderCompareChart(rows, list);
  // the table can be sorted by destination, by one origin's stay rate or by the largest gap; a third click returns to the
  // default order by combined sample size, which is not a column (designer ruling 2026-09-16 17:05 Q3)
  const oi = list.findIndex(o => o.cc === S.cSortKey);
  const cval = r => S.cSortKey === 'dest' ? country(r.dc, r.name) : S.cSortKey === 'gap' ? r.gap : oi >= 0 && r.cells[oi] ? r.cells[oi].stay : null;
  const shown = !S.cSortKey || (S.cSortKey !== 'dest' && S.cSortKey !== 'gap' && oi < 0) ? rows : rows.slice().sort((a, b) => {
    const x = cval(a), y = cval(b);
    if(x === null || y === null) return (x === null) - (y === null);   // origins without enough people stay at the bottom either way
    return S.cSortDir * (typeof x === 'string' ? x.localeCompare(y, LANG === 'zh' ? 'zh' : 'en') : x - y) || b.total - a.total;
  });

  wrap.innerHTML = `<div class="warn"><p>${t('cmpWarn')}</p></div>
    <div style="overflow-x:auto"><table>
    <thead><tr>${sortHeader('csort', 'dest', t('cmpThDest'), '', S.cSortKey === 'dest' ? S.cSortDir : 0)}${list.map(o =>
      sortHeader('csort', o.cc, esc(country(o.cc, o.name)), 'num', S.cSortKey === o.cc ? S.cSortDir : 0)).join('')}${sortHeader('csort', 'gap', t('cmpThGap'), 'num hide-s', S.cSortKey === 'gap' ? S.cSortDir : 0)}</tr></thead>
    <tbody>${shown.map(r => `<tr style="cursor:default">
      <td>${esc(country(r.dc, r.name))}</td>
      ${r.cells.map(c => c ? `<td class="num"><span class="cmp-hi">${pc(c.stay)}</span>
        <div class="cmp-n">n=${c.n}</div></td>` : '<td class="num muted">—</td>').join('')}
      <td class="num hide-s cmp-gap">${(r.gap*100).toFixed(0)} pt</td>
    </tr>`).join('')}</tbody></table></div>`;
}

const FINDING_ORIGINS = ['ir','in','br','cn'];
function loadData(cc){
  if(S.allData[cc]) return Promise.resolve(S.allData[cc]);
  return fetch(`data-${cc}.json`).then(r => { if(!r.ok) throw new Error(`data-${cc}.json ${r.status}`); return r.json(); })
    .then(d => (S.allData[cc] = d));
}
function renderFinding(){
  const box = document.getElementById('finding');
  box.hidden = S.view !== 'match';
  if(box.hidden) return;
  document.getElementById('finding-eyebrow').textContent = t('fEyebrow');
  document.getElementById('finding-h').textContent = t('fTitle');
  document.getElementById('finding-lede').textContent = t('fLede');
  document.getElementById('finding-cta').textContent = t('fCta');
  document.getElementById('finding-legend').innerHTML = OUT_KEYS.map(([k,c]) => `<span><i style="background:${c}"></i>${t('out')[k]}</span>`).join('');
  const grid = document.getElementById('finding-grid');
  const ready = FINDING_ORIGINS.every(cc => S.allData[cc]);
  if(!ready){
    grid.innerHTML = `<p class="muted small">${t('fLoading')}</p>`;
    Promise.all(FINDING_ORIGINS.map(loadData)).then(renderFinding).catch(e => {
      grid.innerHTML = `<div class="warn" role="alert"><p>${esc(t('fFail')(e.message))} <button type="button" class="btn btn-sm" id="finding-retry">${t('tryAgain')}</button></p></div>`;
      document.getElementById('finding-retry').onclick = () => { renderFinding(); };

    return us && us.strata.long ? {cc, name: originName(d.meta), s: us.strata.long} : null;
  }).filter(Boolean).sort((a,b) => b.s.stay - a.s.stay);
  grid.innerHTML = rows.map(r => `<div class="f-cell">
      <h2>${esc(r.name)}</h2>
      <div class="f-big">${pc(r.s.stay)}</div>
      <div class="f-meta">${t('fStay')}<br>${t('fMeta')(r.s.n, r.s.stay_ci ? pc(r.s.stay_ci[0]) + '–' + pc(r.s.stay_ci[1]) : '—')}</div>
      <div class="bar" role="img" aria-label="${OUT_KEYS.map(([k]) => t('out')[k] + ' ' + pc(r.s[k])).join(', ')}">${OUT_KEYS.map(([k,c]) => r.s[k] ? `<span style="width:${r.s[k]*100}%;background:${c}"></span>` : '').join('')}</div>
    </div>`).join('');
}

/* ── compare chart: one destination, every origin, stay rate with its 95% interval ── */
function renderCompareChart(rows, list){
  const el = document.getElementById('cmp-chart');
  if(!rows.length){ el.innerHTML = ''; return; }
  if(!S.cmpDest || !rows.some(r => r.dc === S.cmpDest)) S.cmpDest = rows.some(r => r.dc === 'us') ? 'us' : rows[0].dc;
  const row = rows.find(r => r.dc === S.cmpDest);
  const destName = country(row.dc, row.name);
  const items = list.map((o, i) => ({o, c: row.cells[i]})).filter(x => x.c).sort((a,b) => b.c.stay - a.c.stay);
  const opts = rows.map(r => `<option value="${esc(r.dc)}"${r.dc === S.cmpDest ? ' selected' : ''}>${esc(country(r.dc, r.name))}</option>`).join('');
  el.innerHTML = `<div class="chart">
    <div class="chart-head"><h2>${esc(t('cmpChartTitle')(destName, t('strata')[S.stratum]))}</h2>
      <label class="lbl" for="cmp-dest">${t('cmpChartDest')}</label><select id="cmp-dest">${opts}</select></div>
    ${items.map(({o, c}) => {
      const lo = c.stay_ci ? c.stay_ci[0] : c.stay, hi = c.stay_ci ? c.stay_ci[1] : c.stay;
      return `<div class="ci-row"><span class="who">${esc(country(o.cc, o.name))}</span>
        <span class="ci-track" role="img" aria-label="${esc(country(o.cc, o.name))}: ${pc(c.stay)}, 95% CI ${pc(lo)} to ${pc(hi)}, n ${c.n}"><i style="left:0;width:${c.stay*100}%"></i><u style="left:${lo*100}%;width:${Math.max((hi-lo)*100, 0.4)}%"></u></span>
        <span class="ci-val">${pc(c.stay)}<small>n=${c.n.toLocaleString()}</small></span></div>`;
    }).join('')}
    <div class="ci-axis" aria-hidden="true"><span></span><span class="ticks">${[0,25,50,75,100].map(v => `<b style="left:${v}%">${v}%</b>`).join('')}</span><span></span></div>
    <p class="ci-cap">${t('cmpChartAxis')}</p>
  </div>`;
  // the chart is rebuilt on every pick, select included: focus goes back to the new select (it fell to <body>)
  el.querySelector('#cmp-dest').onchange = e => { S.cmpDest = e.target.value; S.cmpDestPicked = true; renderCompare(); syncHash(); document.getElementById('cmp-dest').focus(); };
}

function ensureAllOrigins(){
  const list = S.originList || [];
  const todo = list.filter(o => !S.allData[o.cc]);
  if(!todo.length) return Promise.resolve();
  S.originErr = S.originErr || {};
  return Promise.all(todo.map(o =>
    fetch(`data-${o.cc}.json`).then(r => { if(!r.ok) throw new Error(`data-${o.cc}.json ${r.status}`); return r.json(); })
      .then(d => { S.allData[o.cc] = d; delete S.originErr[o.cc]; })
      .catch(e => { S.originErr[o.cc] = e.message; })
  )).then(() => { if(S.view === 'compare') renderCompare(); });
}

          leaving ${m.followup_years} years of follow-up; otherwise "hasn't left yet" gets misread as "stayed".</li>
      <li><b>Institution whitelist</b> — only institutions with a ROR ID and adequate output
          (${m.whitelist_size.toLocaleString()} total), to filter the phantom affiliations OpenAlex
          parses out of free-text strings.</li>
    </ul>

    <h2>Pipeline</h2>
    <ol class="pipe" aria-label="Data pipeline, in order">
      <li><b>OpenAlex</b><span>authors, institutions and sources APIs · CC0, no key</span></li>
      <li><code>institutions.py</code><span>whitelist: ROR ID, output floor, generic-name blacklist</span></li>
      <li><code>harvest.py</code><span>sampled author careers per origin, resumable</span></li>
      <li><code>compute.py</code><span>arrivals, four outcomes, strata, Wilson bounds, tiers; refuses partial data</span></li>
      <li><b>This page</b><span>reads the JSON files below; nothing runs on a server</span></li>
    </ol>
    <p class="pipe-note"><code>venues.py</code> builds the venue board from the same API, and <code>daily.sh</code> runs the
       rounds within the free quota of 1,000 requests a day.</p>

    <h2>Download the data</h2>
    <ul>
      <li><a href="data-${esc(m.origin)}.json" download>data-${esc(m.origin)}.json</a> — every number on this page for ${on}</li>
      <li><a href="origins.json" download>origins.json</a> — the ${(S.originList || []).length || 'available'} origins with their sample sizes</li>
      <li><a href="data-venues.json" download>data-venues.json</a> — the journal and conference board</li>
    </ul>
    ${dataLinks()}

    <h2>Four mutually exclusive outcomes (sum to 100%)</h2>
    <ul>
      <li><b>Stayed</b> — final known affiliations include the destination, not ${on}</li>
      <li><b>Dual</b> — both sides. Very common among Chinese researchers (foreign post + home
          co-appointment); kept separate so it inflates neither side</li>
      <li><b>Returned</b> — only ${on}</li>
      <li><b>Onward</b> — neither; moved to a third country</li>
    </ul>

    <h2>Why stratify by length of stay</h2>
    <p>The 2–3-year band is dominated by visiting scholars and joint-training students — people who were
       always going home. Pooling them dilutes every institution's stay rate toward the same low number.
       The default stratum is <b>≥4 years</b>, closer to PhD studies and long-term positions. Switch strata
       and watch the numbers separate — that separation is itself the finding.</p>

    <h2>How Tiers are assigned</h2>
    <p>Institutions are ranked by the <b>lower bound of the 95% CI</b> on the default-stratum stay rate,
       then cut into quartiles <code>R1</code>–<code>R4</code>. Two deliberate choices:</p>
    <ul>
      <li><b>Percentiles, not absolute cutoffs</b> — absolute values drift with sampling; relative position
          within the same batch is stable.</li>
      <li><b>The bound, not the raw rate</b> — 40% of 25 people versus 30% of 300: the former's true value
          may be far lower. Ranking by the bound lets small-sample flukes sink on their own, with no extra
          rules needed.</li>
    </ul>
    <p>Dual counts toward neither side of the ranking — its meaning is inherently ambiguous.</p>

    <h2>What cross-origin comparison can and cannot tell you</h2>
    <p>The Origin Compare page puts the same destination's stay rates side by side across origins.
       <b>It is the one genuinely interesting thing this site has to show</b> — the same destination can
       differ three- to five-fold by origin, and the direction is consistent across dozens of shared
       destinations. That is not noise.</p>
    <p>But be precise about what it supports:</p>
    <ul>
      <li><b>Valid</b>: relative levels and direction. Every origin uses the same sampling and computation,
          so "A's stay rate is higher than B's" holds up.</li>
      <li><b>Not valid</b>: absolute values. The <b>sample frames differ</b> — each is "people who once
          published under that country's affiliation", and research scale, motives to leave, and publishing
          habits differ by country. The absolute percentages are not quotable statistics.</li>
      <li>A destination appears only when <b>at least two origins qualify</b> (n ≥ 60 each) — otherwise
          a nearly empty row would look like information while carrying none.</li>
    </ul>

    <h2>How the venue board is ranked</h2>
    <ul>
      <li>Only venues with ≥2,000 indexed works and <b>h-index ≥5</b>. The floor isn't cosmetic —
          without it, uncited trade magazines (tens of thousands of works, h=0) flood in, inflate the
          per-field counts and dilute every percentile line.</li>
      <li><code>V1</code>–<code>V4</code> are <b>within-field</b> h-index percentiles (top 10% / 30% / 60% / rest).
          <b>Comparing h-index across fields is meaningless</b>, so there is no site-wide banding.</li>
      <li>h-index and 2-year mean citedness come from OpenAlex <code>summary_stats</code> —
          <b>not the same measure as the JCR impact factor</b>; don't map one to the other.</li>
      <li>Conference coverage in OpenAlex is far thinner than journals, and some conferences split by year
          (e.g. CVPR appears as "2022 IEEE/CVF Conference on…"). <b>Treat the conference list as rough.</b></li>
    </ul>

    <h2>Known limitations (stated, not hidden)</h2>
    <ul>${m.caveats.map(c => `<li>${esc(caveat(c))}</li>`).join('')}</ul>

    <h2>Data source</h2>
    <p>${esc(m.source)}, CC0 public domain, no API key required. Generated <code>${esc(m.generated_at)}</code>.</p>`;
    return;
  }
  document.getElementById('v-doc').innerHTML = `
    <h2>这个站在量什么</h2>
    <p>一句话：<b>在${on}起步的科研人员，出去之后最后落在哪儿</b>——按目的国和目的高校分别统计。</p>
    <p>它<b>不</b>回答「哪个国家好移民」，也不回答「留学生的移民成功率」。它的样本是
       OpenAlex 里有署名记录的科研人群，本科就出国、在国内没发过论文的那一批人根本不在样本里。</p>

    <h2>怎么算的</h2>
    <ul>
      <li><b>样本</b>：OpenAlex 中曾在${on}机构署名、且发表 ≥${m.min_works} 篇的学者随机抽样，
          共 <code>${m.sampled_authors.toLocaleString()}</code> 人。</li>
      <li><b>本土起步</b>：履历最早年份所在国包含${on} → <code>${m.home_start_authors.toLocaleString()}</code> 人。</li>
      <li><b>一次到达</b>：起步之后在某境外机构挂名跨 ≥2 个年份（只挂 1 年视为合作署名，不计）。
          其中 <code>${m.movers.toLocaleString()}</code> 人（${pc(m.mover_rate)}）有过这样的经历。</li>
      <li><b>观察期</b>：只统计到达年 ≤ <code>${m.arrival_year_cutoff}</code> 的人，留足 ${m.followup_years} 年，
          否则「还没来得及走」会被误算成留下。</li>
      <li><b>机构白名单</b>：只认有 ROR 编号、且产出量达标的高校（共 ${m.whitelist_size.toLocaleString()} 所），
          用来滤掉 OpenAlex 从署名字符串里解析出来的幽灵机构。</li>
    </ul>

    <h2>数据流水线</h2>
    <ol class="pipe" aria-label="数据流水线，按顺序">
      <li><b>OpenAlex</b><span>学者、机构、期刊接口 · CC0，免 key</span></li>
      <li><code>institutions.py</code><span>白名单：ROR 编号、产出下限、通用名黑名单</span></li>
      <li><code>harvest.py</code><span>按来源国抽样学者履历，可断点续跑</span></li>
      <li><code>compute.py</code><span>到达、四分类、分层、Wilson 下界、Tier；数据不全拒绝发布</span></li>
      <li><b>本页</b><span>只读下面这些 JSON，没有服务器在算</span></li>
    </ol>
    <p class="pipe-note"><code>venues.py</code> 用同一个接口生成期刊会议榜；<code>daily.sh</code> 在每天 1,000 次免费额度内排着跑。</p>

    <h2>下载数据</h2>
    <ul>
      <li><a href="data-${esc(m.origin)}.json" download>data-${esc(m.origin)}.json</a> —— ${on}这一页上的全部数字</li>
      <li><a href="origins.json" download>origins.json</a> —— ${(S.originList || []).length || '全部'}个来源国及样本量</li>
      <li><a href="data-venues.json" download>data-venues.json</a> —— 期刊会议榜</li>
    </ul>
    ${dataLinks()}

    <h2>终局四分类（互斥，合计 100%）</h2>
    <ul>
      <li><b>留下</b> — 最后已知任职国含目的国、不含${on}</li>
      <li><b>双挂</b> — 两边都含。中国学者里非常常见（境外教职 + 国内兼聘/合作），单列出来，
          免得把它算进任何一边虚增数字</li>
      <li><b>回流</b> — 只含${on}</li>
      <li><b>转道</b> — 两个都不含，去了第三国</li>
    </ul>

    <h2>为什么一定要按停留时长分层</h2>
    <p>2–3 年那一档以访问学者、联合培养为主——他们本来就是要回国的，混在一起会把所有学校的留下率
       稀释成一样低。默认口径是 <b>≥4 年</b>，更接近读博/长期职位。切换分层，数字会明显分开，这本身就是结论。</p>

    <h2>Tier 怎么定的</h2>
    <p>按默认分层留下率的 <b>95% 置信下界</b>排序，四分位切 <code>R1</code>–<code>R4</code>。两个刻意的选择：</p>
    <ul>
      <li><b>用分位不用绝对线</b>——绝对值会随抽样口径漂移，而「同一批里的相对位置」是稳的。</li>
      <li><b>用下界不用原始比率</b>——25 人样本里的 40% 和 300 人样本里的 30%，前者的真实值可能低得多。
          按下界排，小样本的侥幸高分自己会掉下去，不需要额外加规则去压。</li>
    </ul>
    <p>双挂不计入排序——它的含义本身就是暧昧的。</p>

    <h2>跨来源怎么比才算数</h2>
    <p>「来源对比」页把同一个目的国、不同起点的留下率并排放。<b>这是本站唯一真正有意思的地方</b>——
       同一个目的国，起点不同，留下率能差三到五倍，而且这个方向在几十个共有目的国上是一致的，
       不是噪音。</p>
    <p>但要看清它能比什么、不能比什么：</p>
    <ul>
      <li><b>能比</b>：相对高低与方向。各来源国用的是同一套抽样与计算口径，所以「A 的留下率高于 B」
          这个判断是站得住的。</li>
      <li><b>不能比</b>：绝对值。各来源国的<b>样本框本身不同</b>——都是「曾在本国机构署名发表」的人，
          而各国的科研体量、出国动机、发表习惯都不一样，绝对百分比不是可以直接引用的统计量。</li>
      <li>目的国要求<b>至少两个来源都达标</b>（各自 n ≥ 60）才出现在对比表里，
          否则一列全是空，看着像有信息其实没有。</li>
    </ul>

    <h2>期刊会议榜怎么排</h2>
    <ul>
      <li>只收录产出 ≥2000 篇、且 <b>h-index ≥5</b> 的期刊与会议。
          h 的下限不是为了好看——不设它会混进大量<b>没有被引记录的行业杂志</b>
          （works 一两万、h=0），把学科条目数撑大、分位线整个稀释。</li>
      <li><code>V1</code>–<code>V4</code> 是<b>学科内</b>按 h-index 的分位（前 10% / 30% / 60% / 其余）。
          <b>跨学科比 h-index 没有意义</b>，所以不做全站统一分档。</li>
      <li>h-index 与 2 年篇均被引来自 OpenAlex 的 <code>summary_stats</code>，
          <b>与 JCR 影响因子不是同一口径</b>，别拿来对号。</li>
      <li>会议在 OpenAlex 里的收录远少于期刊，且有些会议按年份拆成多条
          （例如 CVPR 会出现「2022 IEEE/CVF Conference on…」）。<b>会议榜只能当粗略参考。</b></li>
    </ul>

    <h2>已知的坑（别装看不见）</h2>
    <ul>${m.caveats.map(c => `<li>${esc(c)}</li>`).join('')}</ul>

    <h2>数据来源</h2>

/* one h1 per view: Path Finder has the finding's h1, the other views show their tab name as a visible title */

}

function render(){
  ['match','country','inst','compare','venue','doc'].forEach(v =>
    document.getElementById('v-'+v).hidden = (v !== S.view));
  syncViewHeading();
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.view === S.view));
  renderFinding();
  if(S.view === 'match') renderMatch();
  if(S.view === 'country') renderCountries();

}

function allFields(){
  const set = new Set();
  S.data.institutions.forEach(i =>
    Object.values(i.fields || {}).forEach(list => list.forEach(f => set.add(f.field))));
  return [...set].sort((a,b) => field(a).localeCompare(field(b), LANG==='zh'?'zh':'en'));
}

function initFilters(){
  const ccs = [...new Map(S.data.institutions.map(i => [i.cc, i.country])).entries()]
    .map(([cc, zh]) => [cc, country(cc, zh)])
    .sort((a,b) => a[1].localeCompare(b[1], LANG==='zh'?'zh':'en'));
  const ccOpts = ccs.map(([cc,n]) => `<option value="${cc}">${esc(n)}</option>`).join('');
  const fields = allFields();
  const fOpts = fields.map(f => `<option value="${esc(f)}">${esc(field(f))}</option>`).join('');

  document.getElementById('f-country').innerHTML = `<option value="">${t('allCountries')}</option>` + ccOpts;
  document.getElementById('f-field').innerHTML = `<option value="">${t('allFields')}</option>` + fOpts;
  document.getElementById('m-country').innerHTML = `<option value="">${t('anyDest')}</option>` + ccOpts;
  document.getElementById('m-field').innerHTML = `<option value="">${t('anyFieldOverall')}</option>` + fOpts;
  // Restore current picks after a language switch rebuilds the option lists.
  document.getElementById('f-country').value = S.fCountry;
  document.getElementById('f-field').value = S.fField;
  document.getElementById('m-country').value = S.mCountry;
  document.getElementById('m-field').value = S.mField;
}

function loadOrigin(cc){
  const ld = document.getElementById('loading');
  ld.hidden = false; delete ld.dataset.err;
  ld.textContent = t('loading');
  return fetch(`data-${cc}.json`).then(r => {
    if(!r.ok) throw new Error(`data-${cc}.json ${r.status}`);
    return r.json();
  }).then(d => {
    S.data = d;
    S.origin = cc;
    S.allData[cc] = d;
    d.meta.origin_name_disp = originName(d.meta);
    // Filters picked for the previous origin may not exist in the new data;
    // reset them so the page doesn't go silently blank.
    S.fCountry = S.fField = S.fKind = S.q = S.mField = S.mCountry = S.mKind = '';
    ['f-kind','m-kind'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
    ld.hidden = true;
    stratumSeg(document.getElementById('seg-stratum'));
    stratumSeg(document.getElementById('seg-stratum2'));
    stratumSeg(document.getElementById('seg-stratum3'));
    initFilters();
    document.getElementById('f-q').value = '';
    if(!HASH_STATE.applied){ HASH_STATE.applied = true; applyHashState(); }
    document.getElementById('foot').innerHTML = t('foot')(d);
    render();
    if(S.pendingOpen){ const id = S.pendingOpen; S.pendingOpen = null; openInst(id); }
  }).catch(e => {
    ld.hidden = false; ld.dataset.err = '1'; ld.setAttribute('role', 'alert');
    const retry = document.createElement('button'); retry.type = 'button'; retry.className = 'btn btn-sm'; retry.textContent = t('tryAgain');
    retry.onclick = () => { ld.removeAttribute('role'); loadOrigin(cc); };
    ld.replaceChildren(t('loadFail')(e.message) + ' ', retry);
  });
}

    const sel = document.getElementById('origin-sel');
    refreshOriginSel();
    sel.value = list.some(o => o.cc === S.origin) ? S.origin : list[0].cc;
    document.getElementById('origin-wrap').hidden = false;
    sel.onchange = e => loadOrigin(e.target.value).then(syncHash);
    return loadOrigin(sel.value);
  }
  return loadOrigin(list[0] ? list[0].cc : 'cn');
}).catch(() => loadOrigin('cn'));

applyChrome();
renderFinding();
Appearance.bindToggle(document.getElementById('theme'));   // ◐ switches light/dark only (appearance.js)

};

document.getElementById('m-country').onchange = e => { S.mCountry = e.target.value; renderMatch(); syncHash(); };

// sortable headers are buttons, so they work from the keyboard and announce their state (aria-sort on the sorted column)
document.querySelectorAll('th[data-sort]').forEach(th => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'th-sort';
  while(th.firstChild) b.appendChild(th.firstChild);
  th.appendChild(b);
  b.onclick = () => {
  const k = th.dataset.sort;
  if(S.sortKey === k) S.sortDir *= -1;
  else { S.sortKey = k; S.sortDir = (k === 'name' || k === 'country' || k === 'rank') ? 1 : -1; }
  renderInsts(); syncHash();
};
});
document.getElementById('venue-wrap').addEventListener('click', e => {
  const th = e.target.closest('th[data-vsort]'); if(!th || !e.target.closest('.th-sort')) return;
  const k = th.dataset.vsort;
  if(S.vSortKey === k) S.vSortDir *= -1; else { S.vSortKey = k; S.vSortDir = VSORT[k][1]; }
  renderVenues(); syncHash();
  const again = document.querySelector(`#venue-wrap th[data-vsort="${k}"] .th-sort`); if(again) again.focus();
});
document.getElementById('cmp-wrap').addEventListener('click', e => {
  const th = e.target.closest('th[data-csort]'); if(!th || !e.target.closest('.th-sort')) return;
  const k = th.dataset.csort, first = k === 'dest' ? 1 : -1;
  if(S.cSortKey !== k){ S.cSortKey = k; S.cSortDir = first; }
  else if(S.cSortDir === first) S.cSortDir = -first;
  else { S.cSortKey = null; S.cSortDir = 0; }
  renderCompare(); syncHash();
  const again = document.querySelector(`#cmp-wrap th[data-csort="${k}"] .th-sort`); if(again) again.focus();
});
document.getElementById('inst-body').onclick = e => {
  const tr = e.target.closest('tr[data-id]'); if(tr) openInst(tr.dataset.id);
};
document.getElementById('drawer').onclick = e => {
  if(e.target.dataset.close !== undefined) closeDrawer();
};
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeDrawer();
  trapDrawer(e);
});
// "#main" would replace the view's address (#inst?…), so the skip link moves focus without touching it
// the first visible h1 in main, else the first visible h2, else main (ruling 2026-09-16 20:11 Q16); the address is left alone
function firstHeading(){
  const seen = x => { const r = x.getBoundingClientRect(), cs = getComputedStyle(x); return r.width > 2 && r.height > 2 && cs.visibility !== 'hidden' && !/inset\(50%\)|rect\(0/.test(cs.clipPath + cs.clip); };
  const x = [...document.querySelectorAll('main h1')].find(seen) || [...document.querySelectorAll('main h2')].find(seen) || document.getElementById('main');
  if(x && !x.hasAttribute('tabindex')) x.setAttribute('tabindex', '-1');
  return x;
}
document.getElementById('skip').addEventListener('click', e => { e.preventDefault(); firstHeading().focus(); });
// the top bar wraps on narrow screens; focus scrolls clear of its real height (family rule html{scroll-padding-top})
{ const bar = document.querySelector('.topbar'), sticky = () => document.documentElement.style.setProperty('--sticky-top', bar.offsetHeight + 'px');
  sticky(); new ResizeObserver(sticky).observe(bar); }
// rows and cards open the institution from the keyboard too
const openOnKey = e => { if(e.key !== 'Enter' && e.key !== ' ') return; const el = e.target.closest('[data-id]'); if(!el || el !== e.target) return; e.preventDefault(); openInst(el.dataset.id); };
document.getElementById('inst-body').addEventListener('keydown', openOnKey);
document.getElementById('match-list').addEventListener('keydown', openOnKey);
</script>
